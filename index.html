    ::-webkit-scrollbar-thumb{ background:#475569; border-radius:2px; }
    .animate-pulse-green{ animation:pulse-green 2s infinite; }
    @keyframes pulse-green{ 0%{ box-shadow:0 0 0 0 rgba(16,185,129,.7); } 70%{ box-shadow:0 0 0 10px rgba(16,185,129,0); } 100%{ box-shadow:0 0 0 0 rgba(16,185,129,0); } }
    .animate-fade-in{ animation:fade-in .3s cubic-bezier(.16,1,.3,1) both; }
    @keyframes fade-in{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }

<body>
<div id="root"></div>

<script type="text/babel">
const { useEffect, useMemo, useRef, useState } = React;

// 絕對防禦：避免白屏的錯誤攔截器
window.onerror = function (msg, src, line, col) {
  try{
    const root = document.getElementById("root");
    if(root) {
      root.innerHTML = `<div style="padding:20px;color:#f87171;font-family:monospace;background:#450a0a;height:100vh;">
        <h3 style="font-size:18px;margin-bottom:10px;">⚠️ 系統異常 (防止黑屏)</h3>
        <p style="opacity:0.9;">${String(msg)}</p>
        <p style="opacity:0.7;font-size:12px;margin-top:10px;">Line: ${line}:${col}</p>
      </div>`;
    }
  }catch(e){}
  return false;
};

/* ===== 核心設定與常數 ===== */
const TWD_EXCHANGE_RATE = 31.8; 
const SAVE_KEY = "p2047_v8_1_constitution_save";
const FIXED_MONTH_PARTS = 4;
const BLACK_SWAN_WEEKS = 4;

const ETH_SNIPE_RATIO = 0.050; 
const ADA_SNIPE_RATIO = 0.0000080;

// 輔助工具
const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
const parseNum = (s, fallback = 0) => { const n = Number(String(s).replace(/,/g,"")); return Number.isFinite(n) ? n : fallback; };
const monthKeyNow = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; };
const todayMMDD = () => new Date().toLocaleDateString("zh-TW", { month:"2-digit", day:"2-digit" });
const fmtMoney = (val, currency = 'TWD') => new Intl.NumberFormat('en-US', { style: 'currency', currency, maximumFractionDigits: 0 }).format(val);
const triggerConfetti = () => { if (typeof confetti === "function") confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } }); };

// 預設資料結構
const getInitialData = () => ({
  config: {
    goalBtc: 3.0,
    targetYear: 2047,
    monthlyDcaTwd: 13000,
    loanBalance: 500000,
    loanPayment: 15000,
    loanRate: 2.5
  },
  holdings: {
    btcHot: 0.05,
    btcCold: 0.55999,
    eth: 32.5802,
    ada: 75350.2,
    usdtReserve: 0
  },
  state: {
    logs: [],
    consecutiveGreedWeeks: 0,
    monthPartsRemaining: FIXED_MONTH_PARTS,
    lastMonthKey: monthKeyNow(),
    lastWeeklyExecISO: null,
    sopStatus: { emergency: false, travel: false, dcaBtc: false },
    blackSwan: { active: false, remainingWeeks: 0, weeklyBudget: 0, lastSpent: 0 }
  },
  ui: { btcPrice: 65000, fngIndex: 50, ethBtcRatio: 0.05, adaBtcRatio: 0.000008 }
});

/* =========================================
   UI 共用元件
   ========================================= */
const Card = ({ title, icon, children, className = "" }) => (
  <div className={`bg-slate-900/70 rounded-xl border border-slate-700/50 flex flex-col overflow-hidden shadow-lg ${className}`}>
    <div className="flex items-center px-4 py-3 border-b border-slate-800 bg-slate-800/40">
      <span className="mr-2 text-lg">{icon}</span>
      <h2 className="text-sm font-bold text-slate-100">{title}</h2>
    </div>
    <div className="p-4 flex-1 flex flex-col relative">{children}</div>
  </div>
);

const InputField = ({ label, value, onChange, type="text" }) => (
  <div className="mb-3">
    <label className="block text-[11px] text-slate-400 mb-1 pl-1">{label}</label>
    <input type={type} inputMode="decimal" value={value} onChange={onChange} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm font-mono text-white outline-none focus:border-emerald-500 transition-colors" />
  </div>
);

const TacticalProgressBar = ({ label, current, target, unit, themeColor, isCryptoRatio = false, onExecute }) => {
  const safeCurrent = isNaN(current) ? 0 : current;
  const progress = Math.min((safeCurrent / target) * 100, 100);
  const isCompleted = progress >= 100;
  const colors = {
    blue: { bg: 'bg-blue-500', text: 'text-blue-400' },
    amber: { bg: 'bg-amber-500', text: 'text-amber-400' },
    emerald: { bg: 'bg-emerald-500', text: 'text-emerald-400' }
  };
  const theme = isCompleted ? colors.emerald : colors[themeColor];
  
  return (
    <div className="mb-6 relative">
      <div className="flex justify-between items-end mb-1.5">
        <span className="text-sm font-semibold text-slate-300">{label}</span>
        <div className="text-right">
          <span className="text-[10px] font-mono text-slate-500 block">TARGET: {isCryptoRatio ? target.toFixed(6) : target}</span>
          <span className={`text-sm font-mono font-bold ${theme.text}`}>LIVE: {safeCurrent > 0 ? (isCryptoRatio ? safeCurrent.toFixed(6) : safeCurrent) : 'SYNCING'} {unit}</span>
        </div>
      </div>
      <div className="w-full bg-slate-800 rounded-full h-3 relative overflow-hidden border border-slate-700">
        <div className={`h-full rounded-full transition-all duration-1000 ${theme.bg}`} style={{ width: `${progress}%` }} />
      </div>
      {isCompleted ? (
        <button onClick={onExecute} className="w-full mt-2 py-2 bg-emerald-600/20 border border-emerald-500/50 text-emerald-400 text-xs font-bold rounded-lg hover:bg-emerald-600 hover:text-white transition-colors animate-pulse">
          🔥 達標！點擊執行結算入帳
        </button>
      ) : (
        <div className="flex justify-between items-center mt-1.5">
          <span className="text-[10px] text-slate-500">MONITORING</span>
          <span className={`text-xs font-mono font-bold ${theme.text}`}>{progress.toFixed(2)}%</span>
        </div>
      )}
    </div>
  );
};

/* =========================================
   推算模型與圖表
   ========================================= */
const NativeAreaChart = ({ data }) => {
  const [hoverIndex, setHoverIndex] = useState(null);
  if (!data || data.length === 0) return <div className="text-slate-500 text-center py-10">Initializing Model...</div>;

  const width = 800, height = 260;
  const padding = { top: 20, right: 45, bottom: 30, left: 55 };
  const innerWidth = width - padding.left - padding.right;
  const innerHeight = height - padding.top - padding.bottom;
  const maxY = Math.max(...data.map(d => d.total)) * 1.1; 

  const getX = (index) => padding.left + (index / (data.length - 1)) * innerWidth;
  const getY = (val) => padding.top + innerHeight - (val / maxY) * innerHeight;

  const vooPathTop = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(i)} ${getY(d.voo)}`).join(' ');
  const vooArea = `${vooPathTop} L ${getX(data.length - 1)} ${getY(0)} L ${getX(0)} ${getY(0)} Z`;
  const qqqPathTop = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(i)} ${getY(d.voo + d.qqq)}`).join(' ');
  const qqqPathBottom = [...data].reverse().map((d, i) => `L ${getX(data.length - 1 - i)} ${getY(data[data.length - 1 - i].voo)}`).join(' ');
  const qqqArea = `${qqqPathTop} ${qqqPathBottom} Z`;
  const cryptoPathTop = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(i)} ${getY(d.total)}`).join(' ');
  const cryptoPathBottom = [...data].reverse().map((d, i) => `L ${getX(data.length - 1 - i)} ${getY(data[data.length - 1 - i].voo + data[data.length - 1 - i].qqq)}`).join(' ');
  const cryptoArea = `${cryptoPathTop} ${cryptoPathBottom} Z`;
  
  const prinPath = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(i)} ${getY(d.totalPrin)}`).join(' ');

  const handleInteraction = (e) => {
    if (!e || !e.currentTarget) return;
    const rect = e.currentTarget.getBoundingClientRect();
    let clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
    if (clientX === undefined) return;
    const x = clientX - rect.left;
    const relativeX = Math.max(0, Math.min(x - (rect.width * (padding.left/width)), rect.width * (innerWidth/width)));
    const index = Math.max(0, Math.min(data.length - 1, Math.round((relativeX / (rect.width * (innerWidth/width))) * (data.length - 1))));
    setHoverIndex(prev => (prev !== index ? index : prev));
  };

  return (
    <div className="relative w-full h-full flex flex-col font-mono select-none">
      {/* 使用 touch-pan-y 允許網頁上下滑動，解決痛點2 */}
      <div className="relative flex-1 touch-pan-y" onTouchMove={handleInteraction} onTouchStart={handleInteraction} onMouseMove={handleInteraction} onMouseLeave={() => setHoverIndex(null)}>
        <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-full overflow-visible">
          <defs>
            <linearGradient id="gradVOO" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#10b981" stopOpacity="0.8"/><stop offset="100%" stopColor="#10b981" stopOpacity="0.2"/></linearGradient>
            <linearGradient id="gradQQQ" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#3b82f6" stopOpacity="0.8"/><stop offset="100%" stopColor="#3b82f6" stopOpacity="0.2"/></linearGradient>
            <linearGradient id="gradCrypto" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#f59e0b" stopOpacity="0.8"/><stop offset="100%" stopColor="#f59e0b" stopOpacity="0.2"/></linearGradient>
          </defs>
          <line x1={padding.left} y1={padding.top} x2={width - padding.right} y2={padding.top} stroke="#334155" strokeDasharray="4 4" />
          <text x={padding.left - 10} y={padding.top + 4} fill="#64748b" textAnchor="end">{(maxY/10000000).toFixed(0)}千萬</text>
          <line x1={padding.left} y1={height - padding.bottom} x2={width - padding.right} y2={height - padding.bottom} stroke="#334155" />
          <text x={padding.left - 10} y={height - padding.bottom + 4} fill="#64748b" textAnchor="end">0</text>

          {data.map((d, i) => (i % 3 === 0 || i === data.length - 1) && (<text key={i} x={getX(i)} y={height - 10} fill="#94a3b8" textAnchor="middle">{d.year}</text>))}

          <path d={vooArea} fill="url(#gradVOO)" className="transition-all duration-300" />
          <path d={qqqArea} fill="url(#gradQQQ)" className="transition-all duration-300" />
          <path d={cryptoArea} fill="url(#gradCrypto)" className="transition-all duration-300" />
          <path d={prinPath} fill="none" stroke="#f8fafc" strokeWidth="2.5" strokeDasharray="6 4" className="drop-shadow-md" />

          {hoverIndex !== null && (
            <g>
              <line x1={getX(hoverIndex)} y1={padding.top} x2={getX(hoverIndex)} y2={height - padding.bottom} stroke="rgba(255,255,255,0.3)" strokeWidth="1" strokeDasharray="4 2" />
              <circle cx={getX(hoverIndex)} cy={getY(data[hoverIndex].total)} r="4" fill="#0f172a" stroke="#f59e0b" strokeWidth="2" />
            </g>
          )}
        </svg>

        {hoverIndex !== null && (
          <div className="absolute pointer-events-none bg-slate-900/95 backdrop-blur-xl border border-slate-600 p-3 rounded-xl shadow-[0_10px_30px_rgba(0,0,0,0.8)] z-20 w-[240px]"
               style={{ top: '5px', ...(hoverIndex > data.length/2 ? {right: `${100 - (hoverIndex/(data.length-1))*100}%`, marginRight:'15px'} : {left: `${(hoverIndex/(data.length-1))*100}%`, marginLeft:'15px'}) }}>
            <div className="flex justify-between items-end border-b border-slate-700 pb-2 mb-2">
              <span className="text-white font-bold text-sm">{data[hoverIndex].year} 年</span>
              <span className="text-slate-400 font-normal text-xs">{data[hoverIndex].age} 歲</span>
            </div>
            <div className="bg-slate-800/80 rounded p-2 mb-2 border border-slate-700/50">
              <p className="text-[10px] text-slate-400 mb-0.5">策略狀態 <span className={data[hoverIndex].loanActive ? "text-red-400" : "text-emerald-400"}>({data[hoverIndex].loanActive ? "信貸還款中" : "信貸已清零"})</span></p>
              <p className="text-[11px] text-blue-300 font-bold">{data[hoverIndex].injectDesc}</p>
            </div>
            <div className="space-y-1">
              <p className="text-xs text-amber-400 flex justify-between"><span>Crypto</span><span>{fmtMoney(data[hoverIndex].crypto)}</span></p>
              <p className="text-xs text-blue-400 flex justify-between"><span>QQQ</span><span>{fmtMoney(data[hoverIndex].qqq)}</span></p>
              <p className="text-xs text-emerald-400 flex justify-between"><span>VOO</span><span>{fmtMoney(data[hoverIndex].voo)}</span></p>
              <div className="border-t border-slate-700 my-1.5 pt-1.5" />
              <p className="text-sm font-bold text-white flex justify-between"><span>總淨值</span><span>{fmtMoney(data[hoverIndex].total)}</span></p>
              <p className="text-[10px] text-blue-300 flex justify-between mt-1 bg-blue-900/20 p-1 rounded"><span>實質購買力(扣通膨)</span><span className="font-bold">{fmtMoney(data[hoverIndex].realTotal)}</span></p>
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

const WealthSimulatorEngine = ({ currentAssetTWD, config }) => {
  const [rates, setRates] = useState({ btc: 12, qqq: 10, voo: 7, inf: 2.5 });

  const chartData = useMemo(() => {
    let qqq = 0, voo = 0, crypto = currentAssetTWD > 0 ? currentAssetTWD : 5000000;
    let qqqPrin = 0, vooPrin = 0, cryptoPrin = crypto;
    let currentLoan = config.loanBalance;
    const annualLoanPayment = config.loanPayment * 12;
    const data = [];

    for (let i = 0; i <= (config.targetYear - 2026); i++) {
      const year = 2026 + i;
      let injectDesc = "複利掛機";
      let loanActive = currentLoan > 0;
      let freedUpCash = 0;

      if (i > 0) { qqq *= (1 + rates.qqq/100); voo *= (1 + rates.voo/100); crypto *= (1 + rates.btc/100); }
      
      // 動態信貸精算邏輯
      if (loanActive) {
        let interest = currentLoan * (config.loanRate / 100);
        currentLoan -= (annualLoanPayment - interest);
        if (currentLoan <= 0) { freedUpCash = Math.abs(currentLoan); currentLoan = 0; loanActive = false; }
      } else {
        freedUpCash = annualLoanPayment; // 信貸清零後，整年還款額解放
      }

      const baseInvestTwd = config.monthlyDcaTwd * 12;

      if (year <= 2031) { 
        crypto += baseInvestTwd; cryptoPrin += baseInvestTwd;
        injectDesc = `定投 BTC (${Math.round(config.monthlyDcaTwd/1000)}k/月)`;
        if (year === 2031) {
          qqq += 300000; qqqPrin += 300000; crypto += 300000; cryptoPrin += 300000;
          injectDesc = "保單閃電戰(+60w) & " + injectDesc;
        }
      } else if (year >= 2032 && year <= 2039) {
        let totalInvest = baseInvestTwd + freedUpCash;
        qqq += totalInvest; qqqPrin += totalInvest;
        injectDesc = `定投 QQQ (${Math.round(totalInvest/12/1000)}k/月)`;
      } else if (year >= 2040) {
        let totalInvest = baseInvestTwd + freedUpCash;
        voo += totalInvest; vooPrin += totalInvest;
        injectDesc = `轉防禦 VOO (${Math.round(totalInvest/12/1000)}k/月)`;
      }
      
      data.push({
        year, age: 29 + i, qqq, voo, crypto, total: qqq+voo+crypto, totalPrin: qqqPrin+vooPrin+cryptoPrin,
        realTotal: (qqq+voo+crypto) / Math.pow(1 + rates.inf/100, i), injectDesc, loanActive
      });
    }
    return data;
  }, [rates, currentAssetTWD, config]);

  const finalYear = chartData[chartData.length - 1];

  return (
    <div className="flex flex-col h-full space-y-4">
      <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-700/80 grid grid-cols-4 gap-2">
        {['btc', 'qqq', 'voo', 'inf'].map(k => (
          <div key={k} className="flex flex-col">
            <div className="flex justify-between items-center mb-1">
              <span className="text-[10px] text-slate-400 uppercase">{k}</span>
              <span className="text-[10px] font-mono text-emerald-400">{rates[k]}%</span>
            </div>
            <input type="range" min="1" max="25" step="0.5" value={rates[k]} onChange={e => setRates({...rates, [k]: Number(e.target.value)})} className="w-full h-1 bg-slate-700 rounded-lg appearance-none accent-emerald-500" />
          </div>
        ))}
      </div>
      <div className="flex justify-between items-end border-b border-slate-800 pb-2">
        <div>
          <p className="text-[10px] text-slate-500">EST. {config.targetYear} 總淨值</p>
          <p className="text-2xl font-bold text-white">{fmtMoney(finalYear.total)}</p>
        </div>
        <div className="text-right">
          <p className="text-[10px] text-blue-400/70">實質購買力 (拔管底線)</p>
          <p className="text-lg font-bold text-blue-400 drop-shadow-[0_0_8px_rgba(59,130,246,0.4)]">{fmtMoney(finalYear.realTotal)}</p>
        </div>
      </div>
      <div className="flex-1 min-h-[200px] mt-2 relative"><NativeAreaChart data={chartData} /></div>
    </div>
  );
};

/* =========================================
   主應用結構
   ========================================= */
function App(){
  const [tab, setTab] = useState("home");
  const [appData, setAppData] = useState(getInitialData());
  const [privacyMode, setPrivacyMode] = useState(false);
  const [modal, setModal] = useState(null);

  const { config, holdings, state, ui } = appData;

  // 初始化與存檔
  useEffect(() => {
    try {
      const saved = localStorage.getItem(SAVE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        const nowKey = monthKeyNow();
        if (parsed.state?.lastMonthKey && parsed.state.lastMonthKey !== nowKey) {
          parsed.state.monthPartsRemaining = FIXED_MONTH_PARTS;
          parsed.state.lastMonthKey = nowKey;
          parsed.state.sopStatus = { emergency: false, travel: false, dcaBtc: false };
        }
        setAppData(prev => ({ config: {...prev.config, ...parsed.config}, holdings: {...prev.holdings, ...parsed.holdings}, state: {...prev.state, ...parsed.state}, ui: {...prev.ui, ...parsed.ui} }));
      }
    } catch (e) {}
  }, []);

  useEffect(() => { localStorage.setItem(SAVE_KEY, JSON.stringify(appData)); }, [appData]);

  // 市場報價 API (每30秒)
  const fetchMarket = async () => {
    try {
      const [priceRes, fngRes] = await Promise.all([ fetch('https://api.binance.com/api/v3/ticker/price?symbols=["BTCUSDT","ETHUSDT","ADAUSDT"]'), fetch('https://api.alternative.me/fng/?limit=1') ]);
      const priceData = await priceRes.json();
      const prices = {}; priceData.forEach(item => { prices[item.symbol.replace('USDT', '')] = parseFloat(item.price); });
      const fng = parseInt((await fngRes.json())?.data?.[0]?.value || "50", 10);
      setAppData(p => ({ ...p, ui: { ...p.ui, btcPrice: prices.BTC||p.ui.btcPrice, ethBtcRatio: (prices.ETH/prices.BTC)||p.ui.ethBtcRatio, adaBtcRatio: (prices.ADA/prices.BTC)||p.ui.adaBtcRatio, fngIndex: fng } }));
    } catch (e) {}
  };
  useEffect(() => { fetchMarket(); const t = setInterval(fetchMarket, 30000); return () => clearInterval(t); }, []);

  // 衍生數據
  const totalBtc = holdings.btcHot + holdings.btcCold;
  const portfolioUsdt = (totalBtc * ui.btcPrice) + (holdings.eth * ui.ethBtcRatio * ui.btcPrice) + (holdings.ada * ui.adaBtcRatio * ui.btcPrice) + holdings.usdtReserve;
  const portfolioTwd = portfolioUsdt * TWD_EXCHANGE_RATE;
  
  const monthlyUsdtDca = config.monthlyDcaTwd / TWD_EXCHANGE_RATE;
  const partUsdt = monthlyUsdtDca / FIXED_MONTH_PARTS;
  const reserveCapUsdt = monthlyUsdtDca * 6;

  const addLog = (msg, type="info") => setAppData(p => ({ ...p, state: { ...p.state, logs: [{ id: Date.now(), date: todayMMDD(), msg, type }, ...p.state.logs].slice(0, 100) } }));

  // 每週 DCA 執行邏輯
  const executeWeekly = () => {
    const isSameWeek = (a, b) => { if(!a||!b) return false; const wk = d => { const dt=new Date(d); dt.setUTCDate(dt.getUTCDate()+4-(dt.getUTCDay()||7)); return `${dt.getUTCFullYear()}-W${Math.ceil((((dt-new Date(Date.UTC(dt.getUTCFullYear(),0,1)))/86400000)+1)/7)}`; }; return wk(a)===wk(b); };
    if (isSameWeek(state.lastWeeklyExecISO, new Date().toISOString())) return setModal({ title:"本週已鎖定", body:"本週已執行。若需重置請至「設定」頁面解除鎖定。" });

    const fng = ui.fngIndex;
    let partsLeft = state.monthPartsRemaining, spend = 0, save = 0, action = "";

    if (partsLeft <= 0) { action = "本月份額已用完"; } else {
      if (fng < 20) { action = "A 極度恐慌：4買0存"; spend = 4; save = 0; }
      else if (fng <= 40) { action = "B 恐懼：3買1存"; spend = 3; save = 1; }
      else if (fng <= 75) { action = "C 中性/偏貪：2買2存"; spend = 2; save = 2; }
      else { action = "D 貪婪：0買4存"; spend = 0; save = 4; }
      if (spend + save > partsLeft) { spend = Math.min(spend, partsLeft); save = Math.min(save, partsLeft - spend); }
    }

    const usdtSpent = spend * partUsdt, usdtSaved = save * partUsdt;
    const btcBought = usdtSpent > 0 ? (usdtSpent / ui.btcPrice) : 0;

    setAppData(p => ({ ...p, holdings: { ...p.holdings, btcHot: p.holdings.btcHot + btcBought, usdtReserve: p.holdings.usdtReserve + usdtSaved }, state: { ...p.state, monthPartsRemaining: partsLeft - (spend + save), lastWeeklyExecISO: new Date().toISOString() } }));
    
    addLog(`週報：${action}`, usdtSpent > 0 ? "success" : "warning");
    if (usdtSpent > 0) addLog(`買入 ${btcBought.toFixed(6)} BTC`, "success");
    triggerConfetti();
  };

  const handleSniper = (asset, currentRatio, targetRatio) => {
    if (currentRatio < targetRatio) return alert("匯率未達標");
    const input = prompt(`請輸入實際轉換獲得的 BTC 數量 (目前持有 ${holdings[asset.toLowerCase()]} ${asset}):`);
    const btc = parseFloat(input);
    if (btc > 0) {
      setAppData(p => ({ ...p, holdings: { ...p.holdings, btcHot: p.holdings.btcHot + btc, [asset.toLowerCase()]: 0 } }));
      addLog(`狙擊成功：轉換得 ${btc} BTC`, "success"); triggerConfetti();
    }
  };

  const mask = (val, fmtFunc) => privacyMode ? "****" : fmtFunc(val);
  const updater = (category, key, val) => setAppData(p => ({ ...p, [category]: { ...p[category], [key]: val } }));

  return (
    <div className="app-shell">
      {/* 頂部導航 */}
      <div className="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 z-10 flex justify-between items-center shadow-lg">
        <div onClick={()=>setPrivacyMode(!privacyMode)} className="cursor-pointer">
          <div className="text-[10px] text-slate-500 font-mono mb-0.5 flex items-center gap-1">Project {config.targetYear} {privacyMode?'🙈':''}</div>
          <div className="text-xl font-bold font-mono text-white flex items-center gap-2">
            {mask(totalBtc, v=>v.toFixed(4))} <span className="text-xs text-slate-500 font-normal">/ {config.goalBtc} BTC</span>
          </div>
        </div>
        <div className="text-right">
          <div className="text-[10px] text-slate-500 mb-0.5">倒數至 {config.targetYear}</div>
          <div className="text-sm font-bold text-emerald-400 font-mono drop-shadow-[0_0_8px_rgba(16,185,129,0.3)]">{mask(portfolioTwd, fmtMoney)}</div>
        </div>
      </div>

      {/* 滾動內容區 */}
      <div className="content-scroll">
        <div className="p-4 space-y-5 max-w-lg mx-auto">
          
          {tab === "home" && (
            <div className="space-y-5 animate-fade-in">
              <div className="grid grid-cols-2 gap-3">
                <Card title="Hot Wallet" icon="⚡" className="border-t-2 border-t-amber-500">
                  <div className="text-lg font-mono font-bold text-amber-400 mb-3">{mask(holdings.btcHot, v=>v.toFixed(6))}</div>
                  <button onClick={() => {
                    if(holdings.btcHot < 0.05) return setModal({title:"拒絕", body:"未達 0.05 BTC 提領門檻"});
                    setAppData(p=>({...p, holdings: {...p.holdings, btcCold: p.holdings.btcCold + p.holdings.btcHot, btcHot: 0}})); addLog("轉冷錢包成功", "secure"); triggerConfetti();
                  }} className="text-[10px] py-2 rounded bg-slate-950 border border-slate-700 text-slate-300 w-full hover:bg-slate-700 font-bold">➔ 轉實體冷錢包</button>
                </Card>
                <Card title="Cold Wallet" icon="🛡️" className="border-t-2 border-t-sky-500">
                  <div className="text-lg font-mono font-bold text-sky-400 drop-shadow-[0_0_8px_rgba(56,189,248,0.3)]">{mask(holdings.btcCold, v=>v.toFixed(6))}</div>
                  <div className="text-[10px] text-slate-500 mt-auto">絕對防禦領域</div>
                </Card>
              </div>

              {/* 每週 DCA */}
              <Card title="每週 DCA 樞紐" icon="📈">
                <div className="flex justify-between items-center mb-4 pb-3 border-b border-slate-700/50">
                  <div><div className="text-[10px] text-slate-500">LIVE BTC</div><div className="text-xl font-mono text-white">${ui.btcPrice.toLocaleString()}</div></div>
                  <div className="text-right"><div className="text-[10px] text-slate-500">恐貪指數</div><div className={`text-xl font-mono font-bold ${ui.fngIndex>75?'text-emerald-400':ui.fngIndex<25?'text-red-400':'text-yellow-400'}`}>{ui.fngIndex}</div></div>
                </div>
                <div className="flex justify-between items-center mb-4">
                  <span className="text-[10px] text-slate-400">本月份額 ({FIXED_MONTH_PARTS} 份)</span>
                  <div className="flex gap-1">{[...Array(FIXED_MONTH_PARTS)].map((_, i) => (<div key={i} className={`h-2.5 w-6 rounded-sm border ${i < state.monthPartsRemaining ? 'bg-emerald-500 border-emerald-400' : 'bg-slate-800 border-slate-700'}`} />))}</div>
                </div>
                <button onClick={executeWeekly} className="w-full py-3.5 rounded-xl font-bold bg-emerald-600 text-white hover:bg-emerald-500 shadow-lg text-sm">
                  執行本週 DCA 策略
                </button>
              </Card>

              {/* SOP */}
              <Card title={`SOP 盲操 (${state.lastMonthKey.split('-')[1]}月)`} icon="📅">
                <div className="space-y-2">
                  {[{ id: 'emergency', label: '預備金滿血', desc: 'NT$ 200,000' }, { id: 'travel', label: '娛樂金滿血', desc: 'NT$ 50,000 (無罪惡感)' }, { id: 'dcaBtc', label: `盲買 NT$ ${config.monthlyDcaTwd.toLocaleString()}`, desc: '完成後關閉APP' }].map(item => (
                    <div key={item.id} onClick={() => toggleSop(item.id)} className={`flex items-center space-x-3 p-3 rounded-lg border transition-colors cursor-pointer ${state.sopStatus[item.id] ? 'bg-emerald-900/20 border-emerald-500/30' : 'bg-slate-900/50 border-slate-700'}`}>
                      <div className={`w-5 h-5 flex items-center justify-center rounded-full border-2 ${state.sopStatus[item.id] ? 'bg-emerald-500 border-emerald-500' : 'border-slate-500'}`}>
                        {state.sopStatus[item.id] && <span className="text-white text-xs font-bold">✓</span>}
                      </div>
                      <div><span className={`text-sm block font-bold ${state.sopStatus[item.id] ? 'text-slate-500 line-through' : 'text-slate-200'}`}>{item.label}</span><span className="text-[10px] text-slate-500">{item.desc}</span></div>
                    </div>
                  ))}
                </div>
              </Card>

              {/* 模擬器 */}
              <Card title="動態退休推算模型" icon="🔮" className="p-0">
                <div className="p-4 bg-gradient-to-b from-slate-800 to-slate-900">
                  <p className="text-[10px] text-slate-400 mb-4 font-mono">💡 自動套用憲法資金切換、信貸清零紅利。上下滑動頁面，點擊圖表檢視年份。</p>
                  <WealthSimulatorEngine currentAssetTWD={portfolioTwd} config={config} />
                </div>
              </Card>

              <div className="px-2">
                <div className="text-[10px] text-slate-500 mb-2 font-mono uppercase">System Logs</div>
                <div className="space-y-1.5 font-mono text-xs max-h-40 overflow-y-auto">{state.logs.map(log => (<div key={log.id} className={log.type==="alert"?"text-red-400":log.type==="success"?"text-emerald-400":"text-slate-400"}><span className="opacity-40">[{log.date.slice(5)}]</span> {log.msg}</div>))}</div>
              </div>
            </div>
          )}

          {tab === "convert" && (
            <div className="space-y-4 animate-fade-in">
              <Card title="山寨幣殲滅戰" icon="🎯" className="border-t-2 border-fuchsia-500">
                <p className="text-[11px] text-slate-400 mb-5 pb-3 border-b border-slate-800">戰略紀律：達標即動作，不預測、不留戀。</p>
                <h3 className="text-sm font-bold text-white mb-3 pl-2 border-l-2 border-fuchsia-500">Phase 1: ADA 中繼防禦</h3>
                <TacticalProgressBar label="轉 ETH 並質押 (50%)" current={ui.ethBtcRatio>0?ui.adaBtcRatio/ui.ethBtcRatio:0} target={STRATEGY_TARGETS.ADA_ETH_1} unit="Ratio" themeColor="blue" isCryptoRatio={true} onExecute={()=>handleSniper('ADA', ui.adaBtcRatio, ADA_SNIPE_RATIO)} />
                
                <h3 className="text-sm font-bold text-white mb-3 mt-8 pl-2 border-l-2 border-amber-500">Phase 2: 回歸大本營 BTC</h3>
                <TacticalProgressBar label="預備射擊 (解質押)" current={ui.ethBtcRatio} target={STRATEGY_TARGETS.ETH_BTC_PREP} unit="Ratio" themeColor="amber" isCryptoRatio={true} onExecute={()=>handleSniper('ETH', ui.ethBtcRatio, ETH_SNIPE_RATIO)} />
                <TacticalProgressBar label="獲利了結 (全數轉 BTC)" current={ui.ethBtcRatio} target={STRATEGY_TARGETS.ETH_BTC_EXEC} unit="Ratio" themeColor="amber" isCryptoRatio={true} onExecute={()=>handleSniper('ETH', ui.ethBtcRatio, ETH_SNIPE_RATIO)} />
              </Card>
            </div>
          )}

          {tab === "sop" && (
            <div className="space-y-4 animate-fade-in text-sm text-slate-300 leading-relaxed">
              <Card title={`終極防禦・執行憲法`} icon="📜">
                <div className="text-xs text-slate-400 mb-4 pb-2 border-b border-slate-800">執行期間：2026.02 - {config.targetYear}.12｜執行人：[陳祥豪]</div>
                <ul className="list-disc pl-4 space-y-2 text-xs">
                  <li><strong className="text-emerald-300">每月盲買：</strong>發薪日買入 NT$ {config.monthlyDcaTwd.toLocaleString()} BTC。</li>
                  <li><strong className="text-emerald-300">2031 閃電戰：</strong>保單 60 萬到期全灌入。</li>
                  <li><strong className="text-blue-300">2032 轉向：</strong>信貸清零，每月釋出資金全買 QQQ。</li>
                  <li><strong className="text-blue-300">2040 防禦：</strong>資金全轉 VOO，建安全緩衝區。</li>
                  <li><strong className="text-red-400">生活防禦：</strong>2035 前禁新增負債。>3000 元消費強制 24h 冷靜。職場啟動 NPC 模式。</li>
                </ul>
              </Card>
            </div>
          )}

          {tab === "system" && (
            <div className="space-y-5 animate-fade-in">
              <Card title="銀行與信貸中控台" icon="💳" className="border-t-2 border-red-500">
                <div className="grid grid-cols-2 gap-3 mb-2">
                  <InputField label="信貸總餘額 (TWD)" value={config.loanBalance} type="number" onChange={e => updater('config', 'loanBalance', parseNum(e.target.value))} />
                  <InputField label="每月還款額 (TWD)" value={config.loanPayment} type="number" onChange={e => updater('config', 'loanPayment', parseNum(e.target.value))} />
                  <InputField label="信貸年利率 (%)" value={config.loanRate} type="number" onChange={e => updater('config', 'loanRate', parseNum(e.target.value))} />
                  <InputField label="發薪日投入 (TWD)" value={config.monthlyDcaTwd} type="number" onChange={e => updater('config', 'monthlyDcaTwd', parseNum(e.target.value))} />
                </div>
                <p className="text-[10px] text-slate-400 bg-slate-900 p-2 rounded leading-relaxed border border-slate-700">💡 系統會自動精算。信貸清零時，原本還款的現金流會自動灌入 QQQ 進行複利推算。</p>
              </Card>

              <Card title="核心資產與長期戰略" icon="🏦" className="border-t-2 border-emerald-500">
                <div className="grid grid-cols-2 gap-3 mb-4 border-b border-slate-700/50 pb-4">
                  <InputField label="熱錢包 BTC" value={holdings.btcHot} type="number" onChange={e => updater('holdings', 'btcHot', parseNum(e.target.value))} />
                  <InputField label="冷錢包 BTC" value={holdings.btcCold} type="number" onChange={e => updater('holdings', 'btcCold', parseNum(e.target.value))} />
                  <InputField label="ETH 數量" value={holdings.eth} type="number" onChange={e => updater('holdings', 'eth', parseNum(e.target.value))} />
                  <InputField label="ADA 數量" value={holdings.ada} type="number" onChange={e => updater('holdings', 'ada', parseNum(e.target.value))} />
                  <InputField label="預備金 USDT" value={holdings.usdtReserve} type="number" onChange={e => updater('holdings', 'usdtReserve', parseNum(e.target.value))} />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <InputField label="目標退休年份" value={config.targetYear} type="number" onChange={e => updater('config', 'targetYear', parseNum(e.target.value))} />
                  <InputField label="最終目標 BTC" value={config.goalBtc} type="number" onChange={e => updater('config', 'goalBtc', parseNum(e.target.value))} />
                </div>
              </Card>

              <Card title="系統管理" icon="⚙️">
                <div className="grid grid-cols-2 gap-3 mb-4">
                  <button onClick={() => { navigator.clipboard.writeText(JSON.stringify(appData)); setModal({title:"成功", body:"已複製備份資料。"}); }} className="bg-slate-700 py-3 rounded-lg text-xs font-bold text-white hover:bg-slate-600">匯出備份 JSON</button>
                  <button onClick={() => { try{ const d = JSON.parse(prompt("請貼上 JSON:")); if(d.state){ setAppData(d); alert("還原成功");} }catch(e){ alert("資料格式錯誤"); } }} className="bg-slate-700 py-3 rounded-lg text-xs font-bold text-white hover:bg-slate-600">匯入還原</button>
                </div>
                <button onClick={() => { updater('state', 'lastWeeklyExecISO', null); setModal({title:"已解鎖", body:"本週已解除鎖定，可重新執行 DCA。"}); }} className="w-full bg-yellow-600/20 text-yellow-500 border border-yellow-600/50 py-3 rounded-lg text-xs font-bold hover:bg-yellow-600 hover:text-slate-900 transition-colors">
                  強制解除「本週 DCA 已執行」鎖定
                </button>
              </Card>
            </div>
          )}

          {/* 解決痛點1：隱形的底部 Spacer */}
          <div className="h-10 shrink-0"></div>

        </div>
      </div>

      {/* 底部導航 */}
      <div className="tabbar">
        <div className="tabbar-inner gap-2">
          {[{ id: 'home', label: '行動', icon: '⚡' }, { id: 'convert', label: '狙擊', icon: '🎯' }, { id: 'sop', label: '憲法', icon: '📜' }, { id: 'system', label: '設定', icon: '⚙️' }].map(t => (
            <button key={t.id} onClick={() => setTab(t.id)} className={`flex-1 py-2 rounded-xl flex flex-col items-center justify-center gap-1 transition-colors ${tab === t.id ? 'bg-slate-800 text-emerald-400 border border-slate-700' : 'text-slate-500 hover:bg-slate-800/50'}`}>
              <span className="text-lg">{t.icon}</span><span className="text-[10px] font-bold">{t.label}</span>
            </button>
          ))}
        </div>
      </div>

      {modal && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in" onClick={(e)=> e.target===e.currentTarget && setModal(null)}>
          <div className="bg-slate-800 border border-slate-600 w-full max-w-sm rounded-2xl p-6 shadow-2xl relative">
            <h3 className="text-xl font-bold text-white mb-3">{modal.title}</h3>
            {typeof modal.body === "string" ? <div className="text-slate-300 mb-5 whitespace-pre-wrap text-sm leading-relaxed">{modal.body}</div> : <div className="text-slate-300 mb-5">{modal.body}</div>}
            <button onClick={()=>setModal(null)} className="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded-xl text-white font-bold transition-colors">關閉</button>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
