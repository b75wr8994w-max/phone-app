<head>

    .content-scroll{

<body>
<div id="root"></div>

<script type="text/babel">
const { useEffect, useMemo, useRef, useState } = React;

/* ===== 核心常數與設定 ===== */
const PLAN_START_ISO = "2026-02-01T00:00:00+08:00";
const TWD_EXCHANGE_RATE = 31.8; 

const SAVE_KEY = "p2047_v8_constitution_save";
const CACHE_KEY_METRICS = "p2047_v8_metrics_cache";
const APP_VERSION = "8.0.0";

const FIXED_MONTH_PARTS = 4;
const BLACK_SWAN_WEEKS = 4;
const BLACK_SWAN_STOP_REBOUND = 15;

const ETH_SNIPE_RATIO = 0.050; 
const ADA_SNIPE_RATIO = 0.0000080;
const ETH_ALERT_RATIO = 0.045;
const ADA_ALERT_RATIO = 0.0000075;

const STRATEGY_TARGETS = {
  ADA_ETH_1: 0.00025,
  ADA_ETH_2: 0.00040,
  ETH_BTC_PREP: 0.045,
  ETH_BTC_EXEC: 0.050,
};

// 處理長期設定檔 (加入信貸與台幣動態設定)
const normalizeConfig = (raw = {}) => {
  const goalBtc = Math.max(0.01, Number(raw.goalBtc ?? 3.0));
  const targetYear = Math.max(2026, Number(raw.targetYear ?? 2047));
  const monthlyDcaTwd = Math.max(1000, Number(raw.monthlyDcaTwd ?? 13000));
  const loanBalance = Math.max(0, Number(raw.loanBalance ?? 500000));
  const loanPayment = Math.max(0, Number(raw.loanPayment ?? 15000));
  const loanRate = Math.max(0, Number(raw.loanRate ?? 2.5));
  return { goalBtc, targetYear, monthlyDcaTwd, loanBalance, loanPayment, loanRate };
};

const calcReserveCap = (monthlyUsdt) => Math.max(0, Number(monthlyUsdt || 0) * 6);

/* ===== 輔助工具 ===== */
const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
const parseNum = (s, fallback = NaN) => { const n = Number(String(s).replace(/,/g,"")); return Number.isFinite(n) ? n : fallback; };
const monthKeyNow = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; };
const todayMMDD = () => new Date().toLocaleDateString("zh-TW", { month:"2-digit", day:"2-digit" });
const reboundPctFrom = (low, now) => (low>0 && now>0) ? ((now-low)/low)*100 : 0;
const fmtMoney = (val, currency = 'TWD') => new Intl.NumberFormat('en-US', { style: 'currency', currency, maximumFractionDigits: 0 }).format(val);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

const triggerConfetti = () => {
  if (typeof confetti === "function") confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
};

/* ===== 初始狀態 ===== */
const initialStateNow = () => ({
  btcHot: 0.0,
  btcCold: 0.55999,
  usdtReserve: 0,
  eth: 32.5802,
  ada: 75350.2,

  logs: [],
  consecutiveGreedWeeks: 0,
  monthPartsRemaining: FIXED_MONTH_PARTS,
  lastMonthKey: monthKeyNow(),
  lastWeeklyExecISO: null,
  
  sopStatus: { emergency: false, travel: false, dcaBtc: false },
  disciplineByMonth: {},

  blackSwan: { active: false, remainingWeeks: 0, weeklyBudget: 0, startedAtISO: null, reason: null, anchorPrice: 0, lowPrice: 0, lastSpent: 0 }
});

/* =========================================
   UI 元件：進度條與推算模型
   ========================================= */
const TacticalProgressBar = ({ label, current, target, unit, themeColor, isCryptoRatio = false, onExecute }) => {
  const safeCurrent = isNaN(current) ? 0 : current;
  const progress = Math.min((safeCurrent / target) * 100, 100);
  const isCompleted = progress >= 100;
  
  const colors = {
    blue: { bg: 'bg-blue-500', shadow: 'shadow-[0_0_10px_rgba(59,130,246,0.5)]', text: 'text-blue-400' },
    amber: { bg: 'bg-amber-500', shadow: 'shadow-[0_0_10px_rgba(245,158,11,0.5)]', text: 'text-amber-400' },
    emerald: { bg: 'bg-emerald-500', shadow: 'shadow-[0_0_10px_rgba(16,185,129,0.5)]', text: 'text-emerald-400' }
  };
  const theme = isCompleted ? colors.emerald : colors[themeColor];
  const displayTarget = isCryptoRatio ? target.toFixed(5) : target.toLocaleString();
  const displayCurrent = isCryptoRatio ? safeCurrent.toFixed(6) : safeCurrent.toLocaleString();

  return (
    <div className="mb-5 last:mb-0 relative">
      <div className="flex justify-between items-end mb-1.5">
        <span className="text-sm font-semibold text-slate-300">{label}</span>
        <div className="text-right">
          <span className="text-xs font-mono text-slate-500 block mb-0.5">TARGET: {displayTarget}</span>
          <span className={`text-sm font-mono font-bold ${theme.text}`}>LIVE: {safeCurrent > 0 ? displayCurrent : 'SYNCING'} {unit}</span>
        </div>
      </div>
      <div className="w-full bg-slate-800 rounded-full h-3 relative overflow-hidden border border-slate-700">
        <div className={`h-full rounded-full transition-all duration-1000 ease-out ${theme.bg} ${theme.shadow}`} style={{ width: `${progress}%` }} />
        {!isCompleted && safeCurrent > 0 && <div className="absolute inset-0 bg-white/10 animate-pulse" />}
      </div>
      {isCompleted ? (
        <button onClick={onExecute} className="w-full mt-2 py-1.5 bg-emerald-600/20 border border-emerald-500/50 text-emerald-400 text-xs font-bold rounded hover:bg-emerald-600 hover:text-white transition-colors animate-pulse">
          🔥 點擊執行結算入帳
        </button>
      ) : (
        <div className="flex justify-between items-center mt-1.5">
          <span className="text-[10px] text-slate-500">MONITORING</span>
          <span className={`text-xs font-mono font-bold ${theme.text}`}>{progress.toFixed(2)}%</span>
        </div>
      )}
    </div>
  );
};

const NativeAreaChart = ({ data }) => {
  const [hoverIndex, setHoverIndex] = useState(null);
  if (!data || data.length === 0) return <div className="text-slate-500 text-center py-10">Initializing Model...</div>;

  const width = 800;
  const height = 280;
  const padding = { top: 20, right: 45, bottom: 30, left: 55 };
  const innerWidth = width - padding.left - padding.right;
  const innerHeight = height - padding.top - padding.bottom;

  const maxY = Math.max(...data.map(d => d.total)) * 1.1; 
  const maxValText = (maxY / 10000000).toFixed(0) + ' 千萬';

  const getX = (index) => padding.left + (index / (data.length - 1)) * innerWidth;
  const getY = (val) => padding.top + innerHeight - (val / maxY) * innerHeight;

  const vooPathTop = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(i)} ${getY(d.voo)}`).join(' ');
  const vooArea = `${vooPathTop} L ${getX(data.length - 1)} ${getY(0)} L ${getX(0)} ${getY(0)} Z`;

  const qqqPathTop = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(i)} ${getY(d.voo + d.qqq)}`).join(' ');
  const qqqPathBottom = [...data].reverse().map((d, i) => `L ${getX(data.length - 1 - i)} ${getY(data[data.length - 1 - i].voo)}`).join(' ');
  const qqqArea = `${qqqPathTop} ${qqqPathBottom} Z`;

  const cryptoPathTop = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(i)} ${getY(d.total)}`).join(' ');
  const cryptoPathBottom = [...data].reverse().map((d, i) => `L ${getX(data.length - 1 - i)} ${getY(data[data.length - 1 - i].voo + data[data.length - 1 - i].qqq)}`).join(' ');
  const cryptoArea = `${cryptoPathTop} ${cryptoPathBottom} Z`;
  
  const prinPath = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(i)} ${getY(d.totalPrin)}`).join(' ');
  const realTotalPath = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(i)} ${getY(d.realTotal)}`).join(' ');

  // 解決痛點2：改用 touch-pan-y 讓使用者可以上下滑動網頁，同時保有圖表互動
  const handleInteraction = (e) => {
    if (!e || !e.currentTarget) return;
    const rect = e.currentTarget.getBoundingClientRect();
    let clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
    if (clientX === undefined) return;
    const x = clientX - rect.left;
    const relativeX = Math.max(0, Math.min(x - (rect.width * (padding.left/width)), rect.width * (innerWidth/width)));
    const percentage = relativeX / (rect.width * (innerWidth/width));
    const index = Math.max(0, Math.min(data.length - 1, Math.round(percentage * (data.length - 1))));
    setHoverIndex(prev => (prev !== index ? index : prev));
  };

  let tooltipStyle = {};
  if (hoverIndex !== null) {
      const isRightSide = hoverIndex > (data.length / 2);
      if (isRightSide) {
          tooltipStyle = { right: `${100 - (hoverIndex / (data.length - 1)) * 100}%`, marginRight: '15px' };
      } else {
          tooltipStyle = { left: `${(hoverIndex / (data.length - 1)) * 100}%`, marginLeft: '15px' };
      }
  }

  return (
    <div className="relative w-full h-full flex flex-col font-mono select-none">
      <div className="relative flex-1 touch-pan-y" 
           onTouchMove={handleInteraction} onTouchStart={handleInteraction} 
           onMouseMove={handleInteraction} onMouseLeave={() => setHoverIndex(null)}>
        
        <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-full overflow-visible">
          <defs>
            <linearGradient id="gradVOO" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#10b981" stopOpacity="0.8"/><stop offset="100%" stopColor="#10b981" stopOpacity="0.2"/></linearGradient>
            <linearGradient id="gradQQQ" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#3b82f6" stopOpacity="0.8"/><stop offset="100%" stopColor="#3b82f6" stopOpacity="0.2"/></linearGradient>
            <linearGradient id="gradCrypto" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#f59e0b" stopOpacity="0.8"/><stop offset="100%" stopColor="#f59e0b" stopOpacity="0.2"/></linearGradient>
          </defs>

          <rect x={getX(0)} y={padding.top} width={getX(6) - getX(0)} height={innerHeight} fill="rgba(245,158,11,0.03)" />
          <rect x={getX(6)} y={padding.top} width={getX(14) - getX(6)} height={innerHeight} fill="rgba(59,130,246,0.03)" />
          <rect x={getX(14)} y={padding.top} width={getX(21) - getX(14)} height={innerHeight} fill="rgba(16,185,129,0.03)" />
          <text x={getX(3)} y={padding.top + 15} fill="#64748b" textAnchor="middle" fontSize="10">BTC 擴張期</text>
          <text x={getX(10)} y={padding.top + 15} fill="#64748b" textAnchor="middle" fontSize="10">QQQ 複利期</text>
          <text x={getX(17.5)} y={padding.top + 15} fill="#64748b" textAnchor="middle" fontSize="10">VOO 防禦期</text>

          <line x1={padding.left} y1={padding.top} x2={width - padding.right} y2={padding.top} stroke="#334155" strokeDasharray="4 4" />
          <text x={padding.left - 10} y={padding.top + 4} fill="#64748b" textAnchor="end">{maxValText}</text>
          <line x1={padding.left} y1={height - padding.bottom} x2={width - padding.right} y2={height - padding.bottom} stroke="#334155" />
          <text x={padding.left - 10} y={height - padding.bottom + 4} fill="#64748b" textAnchor="end">0</text>

          {data.map((d, i) => (i % 3 === 0 || i === data.length - 1) && (
            <text key={i} x={getX(i)} y={height - 10} fill="#94a3b8" textAnchor="middle">{d.year}</text>
          ))}

          <path d={vooArea} fill="url(#gradVOO)" className="transition-all duration-300" />
          <path d={qqqArea} fill="url(#gradQQQ)" className="transition-all duration-300" />
          <path d={cryptoArea} fill="url(#gradCrypto)" className="transition-all duration-300" />
          <path d={vooPathTop} fill="none" stroke="#059669" strokeWidth="1" opacity="0.5" />
          <path d={qqqPathTop} fill="none" stroke="#2563eb" strokeWidth="1" opacity="0.5" />
          <path d={cryptoPathTop} fill="none" stroke="#d97706" strokeWidth="1.5" />

          <path d={prinPath} fill="none" stroke="#f8fafc" strokeWidth="2.5" strokeDasharray="6 4" className="transition-all duration-300 drop-shadow-md" />
          <path d={realTotalPath} fill="none" stroke="#60a5fa" strokeWidth="1.5" strokeDasharray="2 4" opacity="0.7" className="transition-all duration-300" />

          {hoverIndex !== null && (
            <g>
              <line x1={getX(hoverIndex)} y1={padding.top} x2={getX(hoverIndex)} y2={height - padding.bottom} stroke="rgba(255,255,255,0.3)" strokeWidth="1" strokeDasharray="4 2" />
              <circle cx={getX(hoverIndex)} cy={getY(data[hoverIndex].total)} r="4" fill="#0f172a" stroke="#f59e0b" strokeWidth="2" />
              <circle cx={getX(hoverIndex)} cy={getY(data[hoverIndex].totalPrin)} r="4" fill="#f8fafc" stroke="#0f172a" strokeWidth="2" />
            </g>
          )}
        </svg>

        {hoverIndex !== null && (
          <div className="absolute pointer-events-none bg-slate-900/95 backdrop-blur-xl border border-slate-600 p-3 rounded-xl shadow-[0_10px_30px_rgba(0,0,0,0.8)] z-20 w-[240px] sm:w-[260px]"
               style={{ top: '5px', ...tooltipStyle }}>
            <div className="flex justify-between items-end border-b border-slate-700 pb-2 mb-2">
              <span className="text-white font-bold text-sm sm:text-base">{data[hoverIndex].year} 年</span>
              <span className="text-slate-400 font-normal text-[10px] sm:text-xs">年齡: {data[hoverIndex].age} 歲</span>
            </div>
            
            <div className="bg-slate-800/80 rounded p-2 mb-2 border border-slate-700/50">
              <p className="text-[10px] text-slate-400 mb-0.5">年度戰略 <span className={data[hoverIndex].loanActive ? "text-red-400" : "text-emerald-400"}>({data[hoverIndex].loanActive ? "信貸還款中" : "信貸已清零"})</span></p>
              <p className="text-[11px] sm:text-xs text-blue-300 font-bold leading-tight">{data[hoverIndex].injectDesc}</p>
            </div>

            <div className="space-y-1.5">
              <p className="text-[11px] sm:text-xs text-amber-400 flex justify-between items-center">
                <span>Crypto</span><span>{fmtMoney(data[hoverIndex].crypto)}</span>
              </p>
              <p className="text-[11px] sm:text-xs text-blue-400 flex justify-between items-center">
                <span>QQQ</span><span>{fmtMoney(data[hoverIndex].qqq)}</span>
              </p>
              <p className="text-[11px] sm:text-xs text-emerald-400 flex justify-between items-center">
                <span>VOO</span><span>{fmtMoney(data[hoverIndex].voo)}</span>
              </p>
              <div className="border-t border-slate-700 my-2 pt-2" />
              <p className="text-xs sm:text-sm font-bold text-white flex justify-between">
                <span>帳面淨值</span><span>{fmtMoney(data[hoverIndex].total)}</span>
              </p>
              <p className="text-[10px] sm:text-[11px] text-emerald-400 flex justify-between items-center mt-0.5">
                <span>時間複利</span><span>+{fmtMoney(data[hoverIndex].total - data[hoverIndex].totalPrin)}</span>
              </p>
              <div className="bg-blue-900/20 rounded p-1.5 mt-2">
                 <p className="text-[10px] text-blue-300 flex justify-between">
                   <span>實質購買力 (扣除通膨)</span><span className="font-bold">{fmtMoney(data[hoverIndex].realTotal)}</span>
                 </p>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

// --- 動態信貸精算模型 ---
const WealthSimulatorEngine = ({ currentAssetTWD, config }) => {
  const [btcRate, setBtcRate] = useState(12);
  const [qqqRate, setQqqRate] = useState(10);
  const [vooRate, setVooRate] = useState(7);
  const [inflation, setInflation] = useState(2.5);

  const chartData = useMemo(() => {
    let qqq = 0, voo = 0;
    let crypto = (currentAssetTWD && currentAssetTWD > 0) ? currentAssetTWD : 5135000;
    let qqqPrin = 0, vooPrin = 0, cryptoPrin = crypto;
    
    // 初始化信貸狀態
    let currentLoan = config.loanBalance;
    const annualLoanPayment = config.loanPayment * 12;
    const data = [];

    const yearsToSimulate = config.targetYear - 2026;

    for (let i = 0; i <= yearsToSimulate; i++) {
      const year = 2026 + i;
      let injectDesc = "";
      let loanActive = currentLoan > 0;
      let freedUpCash = 0; // 信貸清零後釋放的年度現金流
      
      if (i > 0) {
        qqq *= (1 + qqqRate/100); voo *= (1 + vooRate/100); crypto *= (1 + btcRate/100);
      }
      
      // 處理信貸扣款與釋放現金流
      if (loanActive) {
        let interest = currentLoan * (config.loanRate / 100);
        let principal = annualLoanPayment - interest;
        currentLoan -= principal;
        
        if (currentLoan <= 0) {
          freedUpCash = Math.abs(currentLoan); // 當年多出來沒還完的現金
          currentLoan = 0;
          loanActive = false;
        }
      } else {
        freedUpCash = annualLoanPayment; // 信貸清零後，整年還款額完全解放
      }

      // 動態基礎定投額 (根據使用者設定)
      const baseInvestTwd = config.monthlyDcaTwd * 12;
      
      if (year >= 2027 && year <= 2031) { 
        crypto += baseInvestTwd;
        cryptoPrin += baseInvestTwd;
        injectDesc = `定投 BTC (${Math.round(config.monthlyDcaTwd/1000)}k/月)`;
        
        if (year === 2031) {
          qqq += 300000; qqqPrin += 300000;
          crypto += 300000; cryptoPrin += 300000;
          injectDesc = "保單奇點閃電戰灌入 + " + injectDesc;
        }
      } else if (year >= 2032 && year <= 2039) {
        let totalInvest = baseInvestTwd + freedUpCash;
        qqq += totalInvest;
        qqqPrin += totalInvest;
        injectDesc = `全力定投 QQQ (${Math.round(totalInvest/12/1000)}k/月)`;
      } else if (year >= 2040) {
        let totalInvest = baseInvestTwd + freedUpCash;
        voo += totalInvest;
        vooPrin += totalInvest;
        injectDesc = `防禦轉投 VOO (${Math.round(totalInvest/12/1000)}k/月)`;
      } else {
        injectDesc = "純複利掛機";
      }
      
      const totalPrin = qqqPrin + vooPrin + cryptoPrin;
      const total = qqq + voo + crypto;
      const realTotal = total / Math.pow(1 + inflation/100, i);
      
      data.push({
        year, age: 29 + i, qqq: Math.round(qqq), voo: Math.round(voo), crypto: Math.round(crypto), 
        total: Math.round(total), qqqPrin: Math.round(qqqPrin), vooPrin: Math.round(vooPrin),
        cryptoPrin: Math.round(cryptoPrin), totalPrin: Math.round(totalPrin), realTotal: Math.round(realTotal),
        injectDesc, loanActive
      });
    }
    return data;
  }, [btcRate, qqqRate, vooRate, inflation, currentAssetTWD, config]);

  const SliderControl = ({ label, value, set, min, max, step = 1, color }) => {
    const colors = { amber: "accent-amber-500 text-amber-400", emerald: "accent-emerald-500 text-emerald-400", blue: "accent-blue-500 text-blue-400", cyan: "accent-cyan-500 text-cyan-400" };
    return (
      <div className="flex flex-col">
        <div className="flex justify-between items-center mb-1.5">
          <span className="text-[10px] text-slate-400 font-medium">{label}</span>
          <span className={`text-xs font-mono font-bold ${colors[color].split(' ')[1]}`}>{value}%</span>
        </div>

          <p className="text-[10px] text-blue-400/70 font-mono mb-0.5">{config.targetYear} 實質購買力 (拔管退休底線)</p>
          <p className="text-lg sm:text-xl font-bold text-blue-400 drop-shadow-[0_0_8px_rgba(59,130,246,0.4)] tracking-tight">
            {fmtMoney(finalYear.realTotal)}

      </div>
      <div className="flex-1 min-h-[220px] w-full mt-2 relative">
        <NativeAreaChart data={chartData} />
      </div>
    </div>
  );
};


/* =========================================
   主應用結構 (融合舊版 API 與新版 UI)

function App(){
  const [state, setState] = useState(initialStateNow());
  const [tab, setTab] = useState("home");
  const [modal, setModal] = useState(null);
  const [showAdvanced, setShowAdvanced] = useState(false);

    btcPrice: "90000", fngIndex: "50", ethBtcRatio: "0.050", adaBtcRatio: "0.000008", athDrawdownPct: "0", below200w: "0", extraReserveAdd: "0"
  });
  const [ui, setUi] = useState({
    btcPrice: 90000, fngIndex: 50, ethBtcRatio: 0.050, adaBtcRatio: 0.000008, athDrawdownPct: 0, ma200w: 0, below200w: 0, dataSource: "Manual"
  });

  const monthlyUsdtDca = config.monthlyDcaTwd / TWD_EXCHANGE_RATE;
  const partUsdt = monthlyUsdtDca / FIXED_MONTH_PARTS;
  const reserveCap = calcReserveCap(monthlyUsdtDca);
  const targetDate = new Date(`${config.targetYear}-12-31T23:59:59+08:00`).getTime();
  const daysLeft = Math.max(0, Math.ceil((targetDate - Date.now()) / (1000*60*60*24)));

  const totalBtc = state.btcHot + state.btcCold;
  const portfolioUsdApprox = (totalBtc * ui.btcPrice) + (state.eth * ui.ethBtcRatio * ui.btcPrice) + (state.ada * ui.adaBtcRatio * ui.btcPrice) + state.usdtReserve;
  const portfolioTwd = portfolioUsdApprox * TWD_EXCHANGE_RATE;

  const currentRatios = {
    ADA_ETH: (ui.ethBtcRatio > 0) ? (ui.adaBtcRatio / ui.ethBtcRatio) : 0,
    ETH_BTC: ui.ethBtcRatio,
    ADA_BTC: ui.adaBtcRatio
  };

  const addLog = (msg, type="info") => {
    const log = { id: Date.now() + Math.random(), date: todayMMDD(), msg, type };
    setState(prev => ({ ...prev, logs: [log, ...prev.logs].slice(0, 320) }));
  };

  const updateInput = (name, val) => { draftRef.current[name] = String(val); const el = document.getElementById(name); if (el) el.value = String(val); };
  const commitUiNumber = (key, raw, fallback) => { let n = parseNum(raw, fallback); if (!Number.isFinite(n)) n = fallback; setUi(p => ({ ...p, [key]: n })); return n; };

  // 讀取存檔
  useEffect(() => {
    try{
      const saved = localStorage.getItem(SAVE_KEY);
      if(saved){
        const parsed = JSON.parse(saved);
        setConfig(normalizeConfig(parsed?.config || {}));
        
        const rawState = parsed?.state ? parsed.state : parsed;
        const nowKey = monthKeyNow();
        if (rawState?.lastMonthKey && rawState.lastMonthKey !== nowKey){
          rawState.monthPartsRemaining = FIXED_MONTH_PARTS;
          rawState.lastMonthKey = nowKey;
          rawState.sopStatus = { emergency: false, travel: false, dcaBtc: false }; // 自動重置 SOP
        }
        setState({ ...initialStateNow(), ...rawState });
        if(parsed?.ui) setUi(p=>({ ...p, ...parsed.ui }));
      }
    }catch(e){ console.error(e); }
  }, []);

  // 寫入存檔
  useEffect(() => {
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify({ config, state, ui })); }catch(e){}
  }, [state, config, ui]);

  // SOP 切換與煙火
  const toggleSop = (key) => {
    setState(prev => {
      const nextStatus = { ...prev.sopStatus, [key]: !prev.sopStatus[key] };
      if (nextStatus.emergency && nextStatus.travel && nextStatus.dcaBtc && !prev.sopStatus[key]) {
        triggerConfetti();
        addLog(`完成 ${prev.lastMonthKey.split('-')[1]} 月無腦盲操紀律！`, "success");
      }
      return { ...prev, sopStatus: nextStatus };
    });
  };

  // 市場數據 API 抓取
  const autofillFromApis = async () => {
    addLog("正在連接市場數據...", "system");
    try{
      const [priceRes, fngRes] = await Promise.all([
        fetch('https://api.binance.com/api/v3/ticker/price?symbols=["BTCUSDT","ETHUSDT","ADAUSDT"]'),
        fetch('https://api.alternative.me/fng/?limit=1')
      ]);
      const priceData = await priceRes.json();
      const fngData = await fngRes.json();
      
      const prices = {};
      priceData.forEach(item => { prices[item.symbol.replace('USDT', '')] = parseFloat(item.price); });
      
      const btc = prices.BTC || 0;
      const ethBtc = prices.ETH && btc ? prices.ETH/btc : 0;
      const adaBtc = prices.ADA && btc ? prices.ADA/btc : 0;
      const fng = parseInt(fngData?.data?.[0]?.value || "50", 10);

      updateInput("btcPrice", Math.round(btc));
      updateInput("fngIndex", fng);
      updateInput("ethBtcRatio", ethBtc.toFixed(5));
      updateInput("adaBtcRatio", adaBtc.toFixed(7));

      setUi(p=>({ ...p, btcPrice: btc, fngIndex: fng, ethBtcRatio: ethBtc, adaBtcRatio: adaBtc, dataSource: "Live-Binance" }));
      addLog(`更新成功｜BTC: $${Math.round(btc)}｜恐貪: ${fng}`, "success");
    }catch(e){
      addLog("數據抓取失敗，請檢查網路", "warning");
    }
  };

  useEffect(() => { setTimeout(autofillFromApis, 200); }, []);

  // 核心執行邏輯 (從舊版搬移)
  const isSameISOWeek = (isoA, isoB) => {
    if(!isoA || !isoB) return false;
    const weekKey = (d) => {
      const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dayNum = date.getUTCDay() || 7;
      date.setUTCDate(date.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
      return `${date.getUTCFullYear()}-W${Math.ceil((((date - yearStart)/86400000) + 1)/7)}`;
    };
    return weekKey(new Date(isoA)) === weekKey(new Date(isoB));
  };
  const canExecuteThisWeek = !isSameISOWeek(state.lastWeeklyExecISO, new Date().toISOString());

  const executeWeekly = () => {
    if (!canExecuteThisWeek) {
      setModal({ title:"本週已執行", body:"本週你已按過一次執行。如抓錯請到【系統】解鎖。" }); return;
    }
    const price = ui.btcPrice;
    const fng = ui.fngIndex;
    if (!(price > 0)) return setModal({ title:"錯誤", body:"請輸入有效的 BTC 價格" });

    let partsLeft = state.monthPartsRemaining;
    let spend = 0, save = 0, action = "";

    if (partsLeft <= 0) {
      action = "本月份額已用完，本次不新增月薪資金";
    } else {
      if (fng < 20) { action = "A 極度恐慌：4買0存"; spend = 4; save = 0; }
      else if (fng <= 40) { action = "B 恐懼：3買1存"; spend = 3; save = 1; }
      else if (fng <= 75) { action = "C 中性/偏貪：2買2存"; spend = 2; save = 2; }
      else { action = "D 貪婪：0買4存"; spend = 0; save = 4; }

      if (spend + save > partsLeft) {
        spend = Math.min(spend, partsLeft); save = Math.min(save, partsLeft - spend);
      }
    }

    const usdtSpent = spend * partUsdt;
    const usdtSaved = save * partUsdt;
    
    // 黑天鵝邏輯簡化版
    const athDD = ui.athDrawdownPct;
    const blackTriggered = (fng < 20) || (athDD >= 30) || (ui.below200w === 1);
    let blackSwan = { ...state.blackSwan, lastSpent: 0 };
    let reserveAfterSave = state.usdtReserve + usdtSaved;
    let blackSpent = 0;

    if (!blackSwan.active && blackTriggered && reserveAfterSave > 0) {
      blackSwan = { active: true, remainingWeeks: BLACK_SWAN_WEEKS, weeklyBudget: reserveAfterSave / BLACK_SWAN_WEEKS, startedAtISO: new Date().toISOString(), reason: (fng<20?"FNG<20":"回撤/破200W") };
      addLog(`黑天鵝啟動：預備金分4週買入`, "alert");
    }
    if (blackSwan.active && blackSwan.remainingWeeks > 0) {
      blackSpent = Math.max(0, Math.min(reserveAfterSave, blackSwan.weeklyBudget));
      reserveAfterSave -= blackSpent;
      blackSwan.remainingWeeks -= 1;
      if (blackSwan.remainingWeeks <= 0) blackSwan.active = false;
    }

    const totalSpent = usdtSpent + blackSpent;
    const btcBought = totalSpent > 0 ? (totalSpent / price) : 0;

    setState(prev => ({
      ...prev, btcHot: prev.btcHot + btcBought, usdtReserve: reserveAfterSave, monthPartsRemaining: partsLeft - (spend + save), blackSwan, lastWeeklyExecISO: new Date().toISOString()
    }));

    addLog(`週報：${action}`, usdtSpent > 0 ? "success" : "warning");
    if (usdtSaved > 0) addLog(`存入預備金：+${Math.round(usdtSaved)}U`, "info");
    if (totalSpent > 0) addLog(`本週投入：${Math.floor(totalSpent)}U → ${btcBought.toFixed(6)} BTC`, "success");
    triggerConfetti();
  };

            確認轉換並入帳

        </div>

    });

    </div>

  return (

                    setState(p=>({...p, btcCold: p.btcCold + p.btcHot, btcHot: 0})); addLog("提領至冷錢包成功", "secure"); triggerConfetti();

                    <h3 className="text-sm font-bold text-white mb-4">Phase 1: ADA 中繼防禦</h3>
                    <TacticalProgressBar label="轉 ETH 並質押 (50% ADA)" current={currentRatios.ADA_ETH} target={STRATEGY_TARGETS.ADA_ETH_1} unit="Ratio" themeColor="blue" isCryptoRatio={true} onExecute={()=>handleSniperExecution('ADA', currentRatios.ADA_BTC, ADA_SNIPE_RATIO)} />
                    <TacticalProgressBar label="極致兌換 (剩餘 50%)" current={currentRatios.ADA_ETH} target={STRATEGY_TARGETS.ADA_ETH_2} unit="Ratio" themeColor="blue" isCryptoRatio={true} onExecute={()=>handleSniperExecution('ADA', currentRatios.ADA_BTC, ADA_SNIPE_RATIO)} />
                  </div>
                  <div className="relative pl-4 border-l-2 border-slate-700">
                    <div className="absolute -left-[5px] top-1 w-2 h-2 rounded-full bg-amber-500" />
                    <h3 className="text-sm font-bold text-white mb-4">Phase 2: 回歸大本營 BTC</h3>
                    <TacticalProgressBar label="預備射擊 (解質押)" current={currentRatios.ETH_BTC} target={STRATEGY_TARGETS.ETH_BTC_PREP} unit="Ratio" themeColor="amber" isCryptoRatio={true} onExecute={()=>handleSniperExecution('ETH', currentRatios.ETH_BTC, ETH_SNIPE_RATIO)} />
                    <TacticalProgressBar label="獲利了結 (100% 轉 BTC)" current={currentRatios.ETH_BTC} target={STRATEGY_TARGETS.ETH_BTC_EXEC} unit="Ratio" themeColor="amber" isCryptoRatio={true} onExecute={()=>handleSniperExecution('ETH', currentRatios.ETH_BTC, ETH_SNIPE_RATIO)} />
                  </div>
                </div>
              </Card>
            </div>
          )}

          {tab === "sop" && (
            <div className="space-y-4 animate-fade-in text-sm text-slate-300 leading-relaxed">
              <Card title={`🛡️ 目標 ${config.goalBtc} BTC《終極防禦・執行憲法》`} icon={<BookOpen className="w-5 h-5 text-emerald-400"/>}>
                <div className="text-xs text-slate-400 mb-4 pb-2 border-b border-slate-800">執行期間：2026.02 - {config.targetYear}.12｜執行人：[陳祥豪]</div>
                <ul className="list-disc pl-4 space-y-2 text-xs">
                  <li><strong className="text-emerald-300">每月盲買：</strong>發薪日買入 NT$ {config.monthlyDcaTwd.toLocaleString()} BTC。</li>
                  <li><strong className="text-emerald-300">2031 閃電戰：</strong>保單 60 萬到期全灌入。</li>
                  <li><strong className="text-blue-300">2032 轉向：</strong>信貸清零，每月釋出資金全買 QQQ。</li>
                  <li><strong className="text-blue-300">2040 防禦：</strong>資金全轉 VOO，建安全緩衝區。</li>
                  <li><strong className="text-red-400">生活防禦：</strong>2035 前禁新增負債。>3000 元消費強制 24h 冷靜。職場啟動 NPC 模式保留體力給家人。</li>
                </ul>
              </Card>
            </div>
          )}

          {tab === "system" && (
            <div className="space-y-4 animate-fade-in">
              
              <Card title="信貸與月定投參數 (影響推算模型)" icon={<Sliders className="w-5 h-5 text-white"/>}>
                <div className="grid grid-cols-2 gap-3 mb-4">
                  <InputField id="cfgMonthly" label="每月投入 (TWD)" defaultVal={config.monthlyDcaTwd} type="number" onCommit={(v)=>setConfig(p=>({...p, monthlyDcaTwd: parseNum(v, 13000)}))} />
                  <InputField id="cfgYear" label="目標年份" defaultVal={config.targetYear} type="number" onCommit={(v)=>setConfig(p=>({...p, targetYear: parseNum(v, 2047)}))} />
                  <InputField id="cfgGoal" label="目標 BTC" defaultVal={config.goalBtc} type="number" onCommit={(v)=>setConfig(p=>({...p, goalBtc: parseNum(v, 3)}))} />
                  
                  <InputField id="cfgLoan" label="信貸餘額 (TWD)" defaultVal={config.loanBalance} type="number" onCommit={(v)=>setConfig(p=>({...p, loanBalance: parseNum(v, 0)}))} />
                  <InputField id="cfgLoanPay" label="每月還款 (TWD)" defaultVal={config.loanPayment} type="number" onCommit={(v)=>setConfig(p=>({...p, loanPayment: parseNum(v, 0)}))} />
                  <InputField id="cfgLoanRate" label="信貸年利率 (%)" defaultVal={config.loanRate} type="number" onCommit={(v)=>setConfig(p=>({...p, loanRate: parseNum(v, 2.5)}))} />
                </div>
                <div className="text-[10px] text-slate-500 leading-relaxed bg-slate-900 p-2 rounded">
                  💡 系統將自動精算信貸扣款，當信貸清零時，原本還款的現金流會自動灌入 QQQ 或 VOO 進行複利推算。
                </div>
              </Card>

              <Card title="系統管理與修正" icon={<Settings className="w-5 h-5 text-white"/>}>
                <div className="grid grid-cols-2 gap-3 mb-4">
                  <button onClick={() => { navigator.clipboard.writeText(JSON.stringify({config, state, ui})); setModal({title:"成功", body:"已複製備份"}); }} className="bg-slate-700 py-3 rounded-xl text-xs font-bold text-white">匯出備份</button>
                  <button onClick={() => { try{ const d = JSON.parse(prompt("貼上 JSON:")); if(d.state){ setConfig(d.config); setState(d.state); setUi(d.ui); alert("還原成功");} }catch(e){ alert("失敗"); } }} className="bg-slate-700 py-3 rounded-xl text-xs font-bold text-white">還原備份</button>
                </div>
                
                <p className="text-[11px] text-slate-400 mb-2 mt-2">手動修正持有量 (不會觸發 DCA)</p>
                <div className="grid grid-cols-2 gap-2 mb-4">
                  <InputField id="modBtc" label="熱錢包 BTC" defaultVal={state.btcHot} type="number" onCommit={(v)=>setState(p=>({...p, btcHot: parseNum(v, p.btcHot)}))} />
                  <InputField id="modCold" label="冷錢包 BTC" defaultVal={state.btcCold} type="number" onCommit={(v)=>setState(p=>({...p, btcCold: parseNum(v, p.btcCold)}))} />
                  <InputField id="modEth" label="ETH" defaultVal={state.eth} type="number" onCommit={(v)=>setState(p=>({...p, eth: parseNum(v, p.eth)}))} />
                  <InputField id="modAda" label="ADA" defaultVal={state.ada} type="number" onCommit={(v)=>setState(p=>({...p, ada: parseNum(v, p.ada)}))} />
                </div>

                <button onClick={() => { setState(p=>({...p, lastWeeklyExecISO: null})); setModal({title:"解鎖", body:"本週已解除鎖定，可重新執行。"}); }} className="w-full bg-yellow-600/20 text-yellow-500 border border-yellow-600/50 py-3 rounded-xl text-xs font-bold hover:bg-yellow-600 hover:text-slate-900 transition-colors">
                  強制解除「本週已執行」鎖定
                </button>
              </Card>
            </div>
          )}

          {/* 解決痛點1：隱形的底部 Spacer，確保滑動到底不被導覽列擋住 */}
          <div className="h-20 shrink-0"></div>

        </div>
      </div>

      {!HIDE_TABBAR && (
        <div className="tabbar" ref={tabbarRef}>
          <div className="tabbar-inner">
            <TabBtn id="home" label="行動" icon="⚡" />
            <TabBtn id="convert" label="狙擊" icon="🎯" />
            <TabBtn id="sop" label="憲法" icon="📜" />
            <TabBtn id="system" label="設定" icon="⚙️" />
          </div>
        </div>
      )}

      {modal && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in" onClick={(e)=> e.target===e.currentTarget && setModal(null)}>
          <div className="bg-slate-800 border border-slate-600 w-full max-w-sm rounded-2xl p-6 shadow-2xl relative">
            <h3 className="text-xl font-bold text-white mb-4">{modal.title}</h3>
            {typeof modal.body === "string" ? <div className="text-slate-300 mb-6 whitespace-pre-wrap">{modal.body}</div> : <div className="text-slate-300 mb-6">{modal.body}</div>}
            <button onClick={()=>setModal(null)} className="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded-xl text-white font-bold">關閉</button>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}
</script>
</body>
</html>
