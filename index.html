<head>

    html, body, #root { height: 100%; }
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
    body{
      margin:0; background:#0f172a; color:#f1f5f9;

<body>
<div id="root"></div>

<script type="text/babel">
const { useEffect, useMemo, useRef, useState } = React;

window.onerror = function (msg, src, line, col) {
  try{
    const root = document.getElementById("root");
    if(root) {
      root.innerHTML = `<div style="padding:20px;color:#f87171;font-family:monospace;background:#450a0a;height:100vh;overflow:auto;">
        <h3 style="font-size:18px;margin-bottom:10px;">⚠️ 系統異常 (防禦機制啟動)</h3>
        <p style="opacity:0.9;">${String(msg)}</p>
        <p style="opacity:0.7;font-size:12px;margin-top:10px;">請回報此錯誤：Line ${line}:${col}</p>
      </div>`;
    }
  }catch(e){}
  return false;
};

/* ===== 核心設定與常數 ===== */
const TWD_EXCHANGE_RATE = 31.8; 
const SAVE_KEY = "p2047_v8_6_constitution_save";

const STRATEGY_TARGETS = {
  ADA_ETH_1: 0.00025,
  ADA_ETH_2: 0.00040,
  ETH_BTC_PREP: 0.045,
  ETH_BTC_EXEC: 0.050,
};

const normalizeConfig = (raw = {}) => {
  const goalBtc = Math.max(0, Number(raw.goalBtc ?? 3.0));
  const targetYear = Math.max(2026, Number(raw.targetYear ?? 2047));
  const monthlyDcaTwd = Math.max(0, Number(raw.monthlyDcaTwd ?? 13000));
  const loanBalance = Math.max(0, Number(raw.loanBalance ?? 500000));
  const loanPayment = Math.max(0, Number(raw.loanPayment ?? 15000));
  const loanRate = Math.max(0, Number(raw.loanRate ?? 2.5));
  return { goalBtc, targetYear, monthlyDcaTwd, loanBalance, loanPayment, loanRate };
};

const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
const parseNum = (s, fallback = 0) => { 
  if(s === "" || s === null || s === undefined) return fallback;
  const n = Number(String(s).replace(/,/g,"")); 
  return Number.isFinite(n) ? n : fallback; 
};
const monthKeyNow = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; };
const todayMMDD = () => new Date().toLocaleDateString("zh-TW", { month:"2-digit", day:"2-digit" });
const fmtMoney = (val, currency = 'TWD') => new Intl.NumberFormat('en-US', { style: 'currency', currency, maximumFractionDigits: 0 }).format(val);
const triggerConfetti = () => { if (typeof confetti === "function") confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } }); };

const getInitialData = () => ({
  config: { goalBtc: 3.0, targetYear: 2047, monthlyDcaTwd: 13000, loanBalance: 500000, loanPayment: 15000, loanRate: 2.5 },
  holdings: { btcHot: 0.05, btcCold: 0.55999, eth: 32.5802, ada: 75350.2, usdtReserve: 0, qqq: 0, voo: 0 },
  state: {
    logs: [], lastMonthKey: monthKeyNow(), lastDcaMonth: null,
    sopStatus: { emergency: false, travel: false, dcaBtc: false }
  },
  ui: { btcPrice: 84900, fngIndex: 50, ethBtcRatio: 0.031, adaBtcRatio: 0.000003 }
});

/* =========================================
   UI 共用元件
   ========================================= */
const Card = ({ title, icon, children, className = "" }) => (
  <div className={`bg-slate-900/70 rounded-xl border border-slate-700/50 flex flex-col overflow-hidden shadow-lg ${className}`}>
    <div className="flex items-center px-4 py-3 border-b border-slate-800 bg-slate-800/40">
      <span className="mr-2 text-lg">{icon}</span>
      <h2 className="text-sm font-bold text-slate-100">{title}</h2>
    </div>
    <div className="p-4 flex-1 flex flex-col relative">{children}</div>
  </div>
);

const InputField = ({ label, value, onCommit, type="text", hint="" }) => {
  const [localVal, setLocalVal] = useState(value);
  useEffect(() => { setLocalVal(value); }, [value]);

  return (
    <div className="mb-3">
      <div className="flex justify-between items-end mb-1 pl-1">
        <label className="block text-[11px] text-slate-400">{label}</label>
        {hint && <span className="text-[9px] text-slate-500">{hint}</span>}
      </div>
      <input type={type} inputMode="decimal" value={localVal} onChange={(e) => setLocalVal(e.target.value)} onBlur={() => onCommit(localVal)} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm font-mono text-white outline-none focus:border-emerald-500 transition-colors" />
    </div>
  );
};

const TacticalProgressBar = ({ label, current, target, unit, themeColor, isCryptoRatio = false, onExecute }) => {
  const safeCurrent = isNaN(current) ? 0 : current;
  const progress = Math.min((safeCurrent / target) * 100, 100);
  const isCompleted = progress >= 100;
  const colors = {
    blue: { bg: 'bg-blue-500', text: 'text-blue-400' },
    amber: { bg: 'bg-amber-500', text: 'text-amber-400' },
    emerald: { bg: 'bg-emerald-500', text: 'text-emerald-400' }
  };
  const theme = isCompleted ? colors.emerald : colors[themeColor];
  
  return (
    <div className="mb-6 relative">
      <div className="flex justify-between items-end mb-1.5">
        <span className="text-sm font-semibold text-slate-300">{label}</span>
        <div className="text-right">
          <span className="text-[10px] font-mono text-slate-500 block">TARGET: {isCryptoRatio ? target.toFixed(6) : target}</span>
          <span className={`text-sm font-mono font-bold ${theme.text}`}>LIVE: {safeCurrent > 0 ? (isCryptoRatio ? safeCurrent.toFixed(6) : safeCurrent) : 'SYNCING'} {unit}</span>
        </div>
      </div>
      <div className="w-full bg-slate-800 rounded-full h-3 relative overflow-hidden border border-slate-700">
        <div className={`h-full rounded-full transition-all duration-1000 ${theme.bg}`} style={{ width: `${progress}%` }} />
      </div>
      {isCompleted ? (
        <button onClick={onExecute} className="w-full mt-2 py-2 bg-emerald-600/20 border border-emerald-500/50 text-emerald-400 text-xs font-bold rounded-lg hover:bg-emerald-600 hover:text-white transition-colors animate-pulse">
          🔥 達標！點擊結算入帳
        </button>
      ) : (
        <div className="flex justify-between items-center mt-1.5">
          <span className="text-[10px] text-slate-500">MONITORING</span>
          <span className={`text-xs font-mono font-bold ${theme.text}`}>{progress.toFixed(2)}%</span>
        </div>
      )}
    </div>
  );
};

/* =========================================
   推算模型與圖表 (去除了 Tooltip 改用狀態提升)
   ========================================= */
const NativeAreaChart = ({ data, hoverIndex, setHoverIndex }) => {
  if (!data || data.length === 0) return <div className="text-slate-500 text-center py-10">Initializing Model...</div>;

  const width = 800, height = 240;
  const padding = { top: 15, right: 45, bottom: 25, left: 75 }; 
  const innerWidth = width - padding.left - padding.right;
  const innerHeight = height - padding.top - padding.bottom;
  const maxY = Math.max(...data.map(d => d.total)) * 1.1; 
  const safeMaxY = maxY > 0 ? maxY : 100;

  const getX = (index) => padding.left + (index / (data.length - 1)) * innerWidth;
  const getY = (val) => padding.top + innerHeight - (val / safeMaxY) * innerHeight;

  const vooPathTop = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(i)} ${getY(d.voo)}`).join(' ');
  const vooArea = `${vooPathTop} L ${getX(data.length - 1)} ${getY(0)} L ${getX(0)} ${getY(0)} Z`;
  const qqqPathTop = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(i)} ${getY(d.voo + d.qqq)}`).join(' ');
  const qqqPathBottom = [...data].reverse().map((d, i) => `L ${getX(data.length - 1 - i)} ${getY(data[data.length - 1 - i].voo)}`).join(' ');
  const qqqArea = `${qqqPathTop} ${qqqPathBottom} Z`;
  const cryptoPathTop = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(i)} ${getY(d.total)}`).join(' ');
  const cryptoPathBottom = [...data].reverse().map((d, i) => `L ${getX(data.length - 1 - i)} ${getY(data[data.length - 1 - i].voo + data[data.length - 1 - i].qqq)}`).join(' ');
  const cryptoArea = `${cryptoPathTop} ${cryptoPathBottom} Z`;
  
  const prinPath = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(i)} ${getY(d.totalPrin)}`).join(' ');

  const handleInteraction = (e) => {
    if (!e || !e.currentTarget) return;
    const rect = e.currentTarget.getBoundingClientRect();
    let clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
    if (clientX === undefined) return;
    const x = clientX - rect.left;
    const relativeX = Math.max(0, Math.min(x - (rect.width * (padding.left/width)), rect.width * (innerWidth/width)));
    const index = Math.max(0, Math.min(data.length - 1, Math.round((relativeX / (rect.width * (innerWidth/width))) * (data.length - 1))));
    setHoverIndex(prev => (prev !== index ? index : prev));
  };

  return (
    <div className="relative w-full h-full flex flex-col font-mono select-none">
      <div className="relative flex-1 touch-pan-y" onTouchMove={handleInteraction} onTouchStart={handleInteraction} onMouseMove={handleInteraction} onMouseLeave={() => setHoverIndex(null)}>
        <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-full overflow-visible">
          <defs>
            <linearGradient id="gradVOO" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#10b981" stopOpacity="0.8"/><stop offset="100%" stopColor="#10b981" stopOpacity="0.2"/></linearGradient>
            <linearGradient id="gradQQQ" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#3b82f6" stopOpacity="0.8"/><stop offset="100%" stopColor="#3b82f6" stopOpacity="0.2"/></linearGradient>
            <linearGradient id="gradCrypto" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#f59e0b" stopOpacity="0.8"/><stop offset="100%" stopColor="#f59e0b" stopOpacity="0.2"/></linearGradient>
          </defs>
          <line x1={padding.left} y1={padding.top} x2={width - padding.right} y2={padding.top} stroke="#334155" strokeDasharray="4 4" />
          <text x={padding.left - 10} y={padding.top + 4} fill="#64748b" textAnchor="end" fontSize="12">{maxY > 0 ? (maxY/10000000).toFixed(1) + '千萬' : '0'}</text>
          <line x1={padding.left} y1={height - padding.bottom} x2={width - padding.right} y2={height - padding.bottom} stroke="#334155" />
          <text x={padding.left - 10} y={height - padding.bottom + 4} fill="#64748b" textAnchor="end" fontSize="12">0</text>

          {data.map((d, i) => (i % 3 === 0 || i === data.length - 1) && (<text key={i} x={getX(i)} y={height - 10} fill="#94a3b8" textAnchor="middle">{d.year}</text>))}

          <path d={vooArea} fill="url(#gradVOO)" className="transition-all duration-300" />
          <path d={qqqArea} fill="url(#gradQQQ)" className="transition-all duration-300" />
          <path d={cryptoArea} fill="url(#gradCrypto)" className="transition-all duration-300" />
          <path d={prinPath} fill="none" stroke="#f8fafc" strokeWidth="2.5" strokeDasharray="6 4" className="drop-shadow-md" />

          {hoverIndex !== null && (
            <g>
              <line x1={getX(hoverIndex)} y1={padding.top} x2={getX(hoverIndex)} y2={height - padding.bottom} stroke="rgba(255,255,255,0.3)" strokeWidth="1" strokeDasharray="4 2" />
              <circle cx={getX(hoverIndex)} cy={getY(data[hoverIndex].total)} r="5" fill="#0f172a" stroke="#f59e0b" strokeWidth="2" />
            </g>
          )}
        </svg>
      </div>
    </div>
  );
};

const WealthSimulatorEngine = ({ cryptoTwd, holdings, config }) => {
  const [rates, setRates] = useState({ btc: 12, qqq: 10, voo: 7, inf: 2.5 });
  const [hoverIndex, setHoverIndex] = useState(null);

  const { qqq: initQqq = 0, voo: initVoo = 0 } = holdings;
  const { loanBalance, loanPayment, loanRate, monthlyDcaTwd, targetYear } = config;

  const chartData = useMemo(() => {
    let qqq = initQqq;
    let voo = initVoo;
    let crypto = cryptoTwd || 0; 
    
    let qqqPrin = qqq, vooPrin = voo, cryptoPrin = crypto;
    let currentLoan = loanBalance;
    const annualLoanPayment = loanPayment * 12;
    const data = [];

    const startYear = 2026;
    const yearsToSimulate = Math.max(0, targetYear - startYear);

    for (let i = 0; i <= yearsToSimulate; i++) {
      const year = startYear + i;
      let injectDesc = "無新增投入 (純複利掛機)";
      let loanActive = currentLoan > 0;
      let freedUpCash = 0;

      if (i > 0) { qqq *= (1 + rates.qqq/100); voo *= (1 + rates.voo/100); crypto *= (1 + rates.btc/100); }
      
      if (loanActive) {
        let interest = currentLoan * (loanRate / 100);
        let principal = annualLoanPayment - interest;
        if (principal > 0) {
          currentLoan -= principal;
          if (currentLoan <= 0) { freedUpCash = Math.abs(currentLoan); currentLoan = 0; loanActive = false; }
        }
      } else {
        freedUpCash = annualLoanPayment; 
      }

      const baseInvestTwd = monthlyDcaTwd * 12;

      if (year <= 2031) { 
        if(baseInvestTwd > 0) {
            crypto += baseInvestTwd; cryptoPrin += baseInvestTwd;
            injectDesc = `定投 BTC (${Math.round(monthlyDcaTwd/1000)}k/月)`;
        }
        if (year === 2031) {
          qqq += 300000; qqqPrin += 300000; crypto += 300000; cryptoPrin += 300000;
          injectDesc = "保單閃電戰(+60w) & " + (baseInvestTwd > 0 ? injectDesc : "無新增定投");
        }
      } else if (year >= 2032 && year <= 2039) {
        let totalInvest = baseInvestTwd + freedUpCash;
        if(totalInvest > 0) {
            qqq += totalInvest; qqqPrin += totalInvest;
            injectDesc = `定投 QQQ (${Math.round(totalInvest/12/1000)}k/月)`;
        }
      } else if (year >= 2040) {
        let totalInvest = baseInvestTwd + freedUpCash;
        if(totalInvest > 0) {
            voo += totalInvest; vooPrin += totalInvest;
            injectDesc = `轉防禦 VOO (${Math.round(totalInvest/12/1000)}k/月)`;
        }
      }
      
      data.push({
        year, age: 29 + i, qqq, voo, crypto, total: qqq+voo+crypto, totalPrin: qqqPrin+vooPrin+cryptoPrin,
        realTotal: (qqq+voo+crypto) / Math.pow(1 + rates.inf/100, i), injectDesc, loanActive
      });
    }
    return data;
  }, [rates, cryptoTwd, initQqq, initVoo, loanBalance, loanPayment, loanRate, monthlyDcaTwd, targetYear]);

  // 取出活躍的年份資料，若沒有 Hover 則預設為最後一年
  const activeData = hoverIndex !== null ? chartData[hoverIndex] : chartData[chartData.length - 1];

  return (
    <div className="flex flex-col h-full space-y-4">
      <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-700/80 grid grid-cols-4 gap-2">
        {['btc', 'qqq', 'voo', 'inf'].map(k => (
          <div key={k} className="flex flex-col">
            <div className="flex justify-between items-center mb-1">
              <span className="text-[10px] text-slate-400 uppercase">{k}</span>
              <span className="text-[10px] font-mono text-emerald-400">{rates[k]}%</span>
            </div>
            <input type="range" min="1" max="25" step="0.5" value={rates[k]} onChange={e => setRates({...rates, [k]: Number(e.target.value)})} className="w-full h-1 bg-slate-700 rounded-lg appearance-none accent-emerald-500" />
          </div>
        ))}
      </div>
      
      {/* 解決痛點1：將 Tooltip 拆除，改為在上方以動態面板顯示，絕不遮擋圖表 */}
      <div className="flex flex-col space-y-3 border-b border-slate-800 pb-3">
        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-2">
          <div>
            <p className="text-[10px] text-slate-500 mb-0.5">
              EST. <span className="font-bold text-slate-300">{activeData?.year}</span> 總淨值
              {activeData?.loanActive ? <span className="text-red-400 ml-1">(信貸還款中)</span> : <span className="text-emerald-400 ml-1">(信貸已清零)</span>}
            </p>
            <p className="text-2xl font-bold text-white tracking-tight">{fmtMoney(activeData?.total || 0)}</p>
          </div>
          <div className="sm:text-right">
            <p className="text-[10px] text-blue-400/70 mb-0.5">實質購買力 (扣通膨)</p>
            <p className="text-lg font-bold text-blue-400 drop-shadow-[0_0_8px_rgba(59,130,246,0.4)] tracking-tight">{fmtMoney(activeData?.realTotal || 0)}</p>
          </div>
        </div>

        <div className="bg-slate-900 rounded-lg p-2.5 border border-slate-700/50">
          <div className="text-[10px] text-slate-400 mb-1 flex justify-between">
             <span>戰略狀態：<span className="text-slate-200 font-bold">{activeData?.injectDesc}</span></span>
             <span>{activeData?.age} 歲</span>
          </div>
          <div className="grid grid-cols-3 gap-2 border-t border-slate-800 pt-2 mt-1">
            <div><p className="text-[9px] text-slate-500">Crypto</p><p className="text-xs font-bold text-amber-400">{fmtMoney(activeData?.crypto || 0)}</p></div>
            <div><p className="text-[9px] text-slate-500">QQQ</p><p className="text-xs font-bold text-blue-400">{fmtMoney(activeData?.qqq || 0)}</p></div>
            <div><p className="text-[9px] text-slate-500">VOO</p><p className="text-xs font-bold text-emerald-400">{fmtMoney(activeData?.voo || 0)}</p></div>
          </div>
        </div>
      </div>

      <div className="flex-1 min-h-[220px] mt-1 relative"><NativeAreaChart data={chartData} hoverIndex={hoverIndex} setHoverIndex={setHoverIndex} /></div>
    </div>
  );
};

/* =========================================
   主應用結構
   ========================================= */
function App(){
  const [tab, setTab] = useState("home");
  const [appData, setAppData] = useState(getInitialData());
  const [privacyMode, setPrivacyMode] = useState(false);
  const [modal, setModal] = useState(null);

  const { config, holdings, state, ui } = appData;

  useEffect(() => {
    try {
      const saved = localStorage.getItem(SAVE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        const nowKey = monthKeyNow();
        if (parsed.state?.lastMonthKey && parsed.state.lastMonthKey !== nowKey) {
          parsed.state.lastMonthKey = nowKey;
          parsed.state.sopStatus = { emergency: false, travel: false, dcaBtc: false };
        }
        setAppData({
          config: { ...getInitialData().config, ...parsed.config },
          holdings: { ...getInitialData().holdings, ...parsed.holdings },
          state: { ...getInitialData().state, ...parsed.state },
          ui: { ...getInitialData().ui, ...parsed.ui }
        });
      }
    } catch (e) {}
  }, []);

  useEffect(() => { localStorage.setItem(SAVE_KEY, JSON.stringify(appData)); }, [appData]);

  const fetchMarket = async () => {
    try {
      const [priceRes, fngRes] = await Promise.all([ fetch('https://api.binance.com/api/v3/ticker/price?symbols=["BTCUSDT","ETHUSDT","ADAUSDT"]'), fetch('https://api.alternative.me/fng/?limit=1') ]);
      const priceData = await priceRes.json();
      const prices = {}; priceData.forEach(item => { prices[item.symbol.replace('USDT', '')] = parseFloat(item.price); });
      const fng = parseInt((await fngRes.json())?.data?.[0]?.value || "50", 10);
      setAppData(p => ({ ...p, ui: { ...p.ui, btcPrice: prices.BTC||p.ui.btcPrice, ethBtcRatio: (prices.ETH/prices.BTC)||p.ui.ethBtcRatio, adaBtcRatio: (prices.ADA/prices.BTC)||p.ui.adaBtcRatio, fngIndex: fng } }));
    } catch (e) {}
  };
  useEffect(() => { fetchMarket(); const t = setInterval(fetchMarket, 30000); return () => clearInterval(t); }, []);

  const totalBtc = holdings.btcHot + holdings.btcCold;
  const cryptoUsdt = (totalBtc * ui.btcPrice) + (holdings.eth * ui.ethBtcRatio * ui.btcPrice) + (holdings.ada * ui.adaBtcRatio * ui.btcPrice) + holdings.usdtReserve;
  const cryptoTwd = cryptoUsdt * TWD_EXCHANGE_RATE;
  
  const tradFiTwd = (holdings.qqq || 0) + (holdings.voo || 0);
  const portfolioTwd = cryptoTwd + tradFiTwd;
  
  const currentRatios = {
    ADA_ETH: (ui.ethBtcRatio > 0) ? (ui.adaBtcRatio / ui.ethBtcRatio) : 0,
    ETH_BTC: ui.ethBtcRatio,
    ADA_BTC: ui.adaBtcRatio
  };

  const addLog = (msg, type="info") => setAppData(p => ({ ...p, state: { ...p.state, logs: [{ id: Date.now(), date: todayMMDD(), msg, type }, ...p.state.logs].slice(0, 100) } }));

  const canExecuteThisMonth = state.lastDcaMonth !== monthKeyNow();

  const executeMonthly = () => {
    if (!canExecuteThisMonth) return setModal({ title:"本月已鎖定", body:"本月 DCA 已執行完畢。若需重置請至「設定」頁面解除鎖定。" });

    const fng = ui.fngIndex;
    const monthlyUsdtDca = config.monthlyDcaTwd / TWD_EXCHANGE_RATE;
    const partUsdt = monthlyUsdtDca / 4; 
    let spendParts = 0, saveParts = 0, action = "";

    if (fng < 20) { action = "A 極度恐慌：100% 買入"; spendParts = 4; saveParts = 0; }
    else if (fng <= 40) { action = "B 恐懼：75% 買 / 25% 存"; spendParts = 3; saveParts = 1; }
    else if (fng <= 75) { action = "C 中性/偏貪：50% 買 / 50% 存"; spendParts = 2; saveParts = 2; }
    else { action = "D 貪婪：0買 100% 存入"; spendParts = 0; saveParts = 4; }

    const usdtSpent = spendParts * partUsdt, usdtSaved = saveParts * partUsdt;
    
    let blackSpent = 0;
    let reserveAfterSave = holdings.usdtReserve + usdtSaved;
    if (fng < 20 && reserveAfterSave > 0) {
        blackSpent = reserveAfterSave * 0.25;
        reserveAfterSave -= blackSpent;
        addLog(`黑天鵝觸發 (FNG<20)：動用 25% 預備金加碼`, "alert");
    }

    const totalSpent = usdtSpent + blackSpent;
    const btcBought = totalSpent > 0 ? (totalSpent / ui.btcPrice) : 0;

    setAppData(p => ({ 
        ...p, 
        holdings: { ...p.holdings, btcHot: p.holdings.btcHot + btcBought, usdtReserve: reserveAfterSave }, 
        state: { ...p.state, lastDcaMonth: monthKeyNow() } 
    }));
    
    addLog(`月報：${action}`, usdtSpent > 0 ? "success" : "warning");
    if (usdtSaved > 0) addLog(`存入預備金：+${Math.round(usdtSaved)}U`, "info");
    if (totalSpent > 0) addLog(`本月投入：${Math.floor(totalSpent)}U → ${btcBought.toFixed(6)} BTC`, "success");
    triggerConfetti();
  };

  const handleSniper = (fromAsset, toAsset, currentRatio, targetRatio) => {
    if (currentRatio < targetRatio) return alert("匯率未達標，請遵守紀律！");
    const input = prompt(`【${fromAsset} ➔ ${toAsset}】\n請輸入你實際轉換獲得的 ${toAsset} 數量：\n(目前持有 ${holdings[fromAsset.toLowerCase()]} 顆 ${fromAsset})`);
    const received = parseFloat(input);
    if (received > 0) {
      setAppData(p => {
        const next = { ...p };
        if (toAsset === 'BTC') next.holdings.btcHot += received;
        else if (toAsset === 'ETH') next.holdings.eth += received;
        return next;
      });
      alert(`成功入帳 ${received} ${toAsset}！\n請記得至「設定」手動扣除賣出的 ${fromAsset} 數量。`);
      addLog(`狙擊成功：獲得 ${received} ${toAsset}`, "success"); 
      triggerConfetti();
    }
  };

  const loanClearYear = useMemo(() => {
    let bal = config.loanBalance;
    if (bal <= 0) return new Date().getFullYear();
    const pay = config.loanPayment * 12;
    if (pay <= 0) return 2099; 
    for(let i=0; i<30; i++) {
       bal += bal * (config.loanRate / 100) - pay;
       if (bal <= 0) return 2026 + i;
    }
    return 2099;
  }, [config.loanBalance, config.loanPayment, config.loanRate]);

  const timelineNodes = useMemo(() => {
    const nodes = [
      { year: 2027.01, title: "守護結束，重啟定投", desc: "太太復職，每月恢復定投。", color: "text-amber-400", dot: "bg-amber-500" },
      { year: 2028.11, title: "算力驗收", desc: "全力以赴完成警察升官等考試。", color: "text-blue-400", dot: "bg-blue-500" },
      { year: 2031.08, title: "保單奇點閃電戰", desc: "60萬到期保單一筆灌入 BTC/QQQ。", color: "text-emerald-400", dot: "bg-emerald-500" },
      { year: 2031.12, title: "星際權杖封存", desc: `BTC 達標 ${config.goalBtc} 顆。停止買入 BTC，啟動冷儲存。`, color: "text-amber-400", dot: "bg-amber-500" },
      { year: loanClearYear + 0.01, title: "法幣水庫啟動 (信貸清零)", desc: `每月釋放之還款金 ${fmtMoney(config.loanPayment)} 轉為全面定投 QQQ。`, color: "text-blue-400", dot: "bg-blue-500" },
      { year: 2040.01, title: "順序風險防禦", desc: "資金全轉 VOO，建安全緩衝區。", color: "text-emerald-400", dot: "bg-emerald-500" },
      { year: config.targetYear, title: "減額月退登出", desc: "VOO/QQQ 達標，啟動 4% 提領拔管退休。", color: "text-white", dot: "bg-white", bold: true }
    ];
    return nodes.sort((a,b) => a.year - b.year);
  }, [config.goalBtc, loanClearYear, config.loanPayment, config.targetYear]);

  const maskStr = (val, fmtFunc) => privacyMode ? "****" : fmtFunc(val);
  const updater = (category, key, val) => setAppData(p => ({ ...p, [category]: { ...p[category], [key]: val } }));

  return (
    <div className="app-shell">
      <div className="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 z-10 flex justify-between items-center shadow-lg">
        <div onClick={()=>setPrivacyMode(!privacyMode)} className="cursor-pointer">
          <div className="text-[10px] text-slate-500 font-mono mb-0.5 flex items-center gap-1">Project {config.targetYear} {privacyMode?'🙈':''}</div>
          <div className="text-xl font-bold font-mono text-white flex items-center gap-2">
            {maskStr(totalBtc, v=>v.toFixed(4))} <span className="text-xs text-slate-500 font-normal">/ {config.goalBtc} BTC</span>
          </div>
        </div>
        <div className="text-right">
          <div className="text-[10px] text-slate-500 mb-0.5">倒數至 {config.targetYear}</div>
          <div className="text-sm font-bold text-emerald-400 font-mono drop-shadow-[0_0_8px_rgba(16,185,129,0.3)]">{maskStr(portfolioTwd, fmtMoney)}</div>
        </div>
      </div>

      <div className="content-scroll">
        <div className="p-4 space-y-5 max-w-lg mx-auto">
          
          {tab === "home" && (
            <div className="space-y-5 animate-fade-in">
              <div className="grid grid-cols-2 gap-3">
                <Card title="Hot Wallet" icon="⚡" className="border-t-2 border-t-amber-500">
                  <div className="text-lg font-mono font-bold text-amber-400 mb-3">{maskStr(holdings.btcHot, v=>v.toFixed(6))}</div>
                  <button onClick={() => {
                    if(holdings.btcHot < 0.05) return setModal({title:"拒絕", body:"未達 0.05 BTC 提領門檻"});
                    setAppData(p=>({...p, holdings: {...p.holdings, btcCold: p.holdings.btcCold + p.holdings.btcHot, btcHot: 0}})); addLog("轉冷錢包成功", "secure"); triggerConfetti();
                  }} className="text-[10px] py-2 rounded bg-slate-950 border border-slate-700 text-slate-300 w-full hover:bg-slate-700 font-bold">➔ 轉實體冷錢包</button>
                </Card>
                <Card title="Cold Wallet" icon="🛡️" className="border-t-2 border-t-sky-500">
                  <div className="text-lg font-mono font-bold text-sky-400 drop-shadow-[0_0_8px_rgba(56,189,248,0.3)]">{maskStr(holdings.btcCold, v=>v.toFixed(6))}</div>
                  <div className="text-[10px] text-slate-500 mt-auto">絕對防禦領域</div>
                </Card>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
                <div className="bg-slate-900/60 rounded-xl border border-slate-700/50 p-4">
                  <div className="text-[11px] text-slate-500 font-mono mb-1 tracking-wider">LIVE BTC/USDT</div>
                  <div className="text-xl font-bold font-mono text-white">${ui.btcPrice.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})}</div>
                </div>
                <div className="bg-slate-900/60 rounded-xl border border-slate-700/50 p-4">
                  <div className="text-[11px] text-slate-500 font-mono mb-1 tracking-wider">LIVE ETH/USDT</div>
                  <div className="text-xl font-bold font-mono text-white">${(ui.btcPrice * ui.ethBtcRatio).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})}</div>
                </div>
                <div className="bg-slate-900/60 rounded-xl border border-slate-700/50 p-4">
                  <div className="text-[11px] text-slate-500 font-mono mb-1 tracking-wider">LIVE ADA/USDT</div>
                  <div className="text-xl font-bold font-mono text-white">${(ui.btcPrice * ui.adaBtcRatio).toLocaleString(undefined, {minimumFractionDigits:4, maximumFractionDigits:4})}</div>
                </div>
                <div className="bg-slate-900/80 rounded-xl border border-slate-700/50 p-4 relative overflow-hidden">
                  <div className="absolute inset-0 bg-gradient-to-br from-emerald-500/10 to-transparent"></div>
                  <div className="text-[11px] text-slate-400 font-mono mb-1 tracking-wider relative z-10">星際艦隊總值估算</div>
                  <div className="text-xl font-bold font-mono text-emerald-400 relative z-10">${Math.floor(cryptoUsdt).toLocaleString()}</div>
                </div>
              </div>

              <Card title="每月 DCA 樞紐" icon="📈">
                <div className="flex justify-between items-center mb-4 pb-3 border-b border-slate-700/50">
                  <div className="text-slate-300 font-bold text-sm">本月配額狀態</div>
                  <div className="text-right"><div className="text-[10px] text-slate-500">恐貪指數</div><div className={`text-xl font-mono font-bold ${ui.fngIndex>75?'text-emerald-400':ui.fngIndex<25?'text-red-400':'text-yellow-400'}`}>{ui.fngIndex}</div></div>
                </div>
                <div className="flex justify-between items-center mb-4">
                  <span className="text-[10px] text-slate-400">系統將依恐貪指數自動分配比例</span>
                  <span className={`text-xs font-bold px-2 py-1 rounded ${canExecuteThisMonth ? 'bg-amber-500/20 text-amber-400' : 'bg-emerald-500/20 text-emerald-400'}`}>
                    {canExecuteThisMonth ? "尚未執行" : "已完成"}
                  </span>
                </div>
                <button onClick={executeMonthly} className={`w-full py-3.5 rounded-xl font-bold transition-all shadow-lg text-sm ${canExecuteThisMonth ? 'bg-emerald-600 text-white hover:bg-emerald-500' : 'bg-slate-800 text-slate-500'}`}>
                  {canExecuteThisMonth ? "執行本月 DCA 策略" : "本月已鎖定"}
                </button>
              </Card>

              <Card title="動態退休推算模型" icon="🔮" className="p-0 border-t-2 border-blue-500">
                <div className="p-4 bg-gradient-to-b from-slate-800 to-slate-900">
                  <p className="text-[10px] text-slate-400 mb-4 font-mono">💡 自動套用憲法資金切換、信貸清零紅利。上下滑動頁面，點擊圖表檢視年份。</p>
                  <WealthSimulatorEngine cryptoTwd={cryptoTwd} holdings={holdings} config={config} />
                </div>
              </Card>
            </div>
          )}

          {tab === "convert" && (
            <div className="space-y-4 animate-fade-in">
              <Card title="山寨幣殲滅戰" icon="🎯" className="border-t-2 border-fuchsia-500">
                <p className="text-[11px] text-slate-400 mb-5 pb-3 border-b border-slate-800">戰略紀律：達標即動作，不預測、不留戀。</p>
                <h3 className="text-sm font-bold text-white mb-3 pl-2 border-l-2 border-fuchsia-500">Phase 1: ADA 中繼防禦</h3>
                <TacticalProgressBar label="轉 ETH 並質押 (50%)" current={currentRatios.ADA_ETH} target={STRATEGY_TARGETS.ADA_ETH_1} unit="Ratio" themeColor="blue" isCryptoRatio={true} onExecute={()=>handleSniper('ADA', 'ETH', currentRatios.ADA_ETH, STRATEGY_TARGETS.ADA_ETH_1)} />
                <TacticalProgressBar label="極致兌換 (剩餘 50%)" current={currentRatios.ADA_ETH} target={STRATEGY_TARGETS.ADA_ETH_2} unit="Ratio" themeColor="blue" isCryptoRatio={true} onExecute={()=>handleSniper('ADA', 'ETH', currentRatios.ADA_ETH, STRATEGY_TARGETS.ADA_ETH_2)} />
                
                <h3 className="text-sm font-bold text-white mb-3 mt-8 pl-2 border-l-2 border-amber-500">Phase 2: 回歸大本營 BTC</h3>
                <TacticalProgressBar label="預備射擊 (解質押)" current={currentRatios.ETH_BTC} target={STRATEGY_TARGETS.ETH_BTC_PREP} unit="Ratio" themeColor="amber" isCryptoRatio={true} onExecute={()=>handleSniper('ETH', 'BTC', currentRatios.ETH_BTC, STRATEGY_TARGETS.ETH_BTC_PREP)} />
                <TacticalProgressBar label="獲利了結 (全數轉 BTC)" current={currentRatios.ETH_BTC} target={STRATEGY_TARGETS.ETH_BTC_EXEC} unit="Ratio" themeColor="amber" isCryptoRatio={true} onExecute={()=>handleSniper('ETH', 'BTC', currentRatios.ETH_BTC, STRATEGY_TARGETS.ETH_BTC_EXEC)} />
              </Card>
            </div>
          )}

          {tab === "sop" && (
            <div className="space-y-4 animate-fade-in text-sm text-slate-300 leading-relaxed">
              <Card title="動態憲法時間軸" icon="🗺️" className="border-t-2 border-blue-500">
                <p className="text-[11px] text-slate-400 mb-4 pb-3 border-b border-slate-800">
                  💡 系統已自動偵測您的信貸參數，並推算出信貸清零的準確時機。
                </p>
                <div className="space-y-4 relative before:absolute before:inset-0 before:ml-[11px] before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-slate-700 before:to-transparent">
                  {timelineNodes.map((item, idx) => (
                    <div key={idx} className="relative flex items-center justify-normal group">
                      <div className="flex items-center justify-center w-6 h-6 rounded-full border-2 border-slate-900 bg-slate-800 shadow shrink-0 z-10">
                        <div className={`w-2 h-2 rounded-full ${item.dot}`}></div>
                      </div>
                      <div className="ml-3 w-full bg-slate-800/40 p-3 rounded-lg border border-slate-700/50 hover:border-slate-600 transition-colors">
                        <div className="flex items-center justify-between mb-1">
                          <span className={`text-xs font-bold ${item.color}`}>{String(item.year).replace('.01', '')}</span>
                        </div>
                        <h4 className={`text-sm ${item.bold ? 'font-black text-white' : 'font-bold text-slate-200'} mb-1`}>{item.title}</h4>
                        <p className="text-[11px] text-slate-400 leading-relaxed">{item.desc}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </Card>

              <Card title={`終極防禦・執行條例`} icon="📜" className="border-t-2 border-emerald-500">
                <div className="text-xs text-slate-400 mb-4 pb-2 border-b border-slate-800">執行期間：2026.02 - {config.targetYear}.12｜執行人：[陳祥豪]</div>
                <ul className="list-disc pl-4 space-y-2 text-xs">
                  <li><strong className="text-emerald-300">每月盲買：</strong>發薪日買入 NT$ {config.monthlyDcaTwd.toLocaleString()} BTC。</li>
                  <li><strong className="text-emerald-300">防禦核心：</strong>熱錢包超過 0.05 BTC 須立即提至冷錢包。</li>
                  <li><strong className="text-blue-300">生活防禦：</strong>2035 前禁新增負債。>3000 元消費強制 24h 冷靜。職場啟動 NPC 模式。</li>
                  <li><strong className="text-red-400">熔斷機制：</strong>若 2029/06 山寨幣仍未達標，100% 強制斬倉換成 BTC，清空沉沒成本。</li>
                </ul>
              </Card>
            </div>
          )}

          {tab === "system" && (
            <div className="space-y-5 animate-fade-in">
              <Card title="銀行與信貸中控台" icon="💳" className="border-t-2 border-red-500">
                <div className="grid grid-cols-2 gap-3 mb-2">
                  <InputField label="信貸總餘額 (TWD)" value={config.loanBalance} type="number" onCommit={v => updater('config', 'loanBalance', parseNum(v))} />
                  <InputField label="每月還款額 (TWD)" value={config.loanPayment} type="number" onCommit={v => updater('config', 'loanPayment', parseNum(v))} />
                  <InputField label="信貸年利率 (%)" value={config.loanRate} type="number" onCommit={v => updater('config', 'loanRate', parseNum(v))} />
                  <InputField label="發薪日投入 (TWD)" value={config.monthlyDcaTwd} type="number" onCommit={v => updater('config', 'monthlyDcaTwd', parseNum(v))} />
                </div>
                <p className="text-[10px] text-slate-400 bg-slate-900 p-2 rounded leading-relaxed border border-slate-700">💡 系統會自動精算。信貸清零時，原本還款的現金流會自動灌入 QQQ 進行複利推算。</p>
              </Card>

              <Card title="核心資產與長期戰略" icon="🏦" className="border-t-2 border-emerald-500">
                <div className="grid grid-cols-2 gap-3 mb-4 border-b border-slate-700/50 pb-4">
                  <InputField label="熱錢包 BTC" value={holdings.btcHot} type="number" onCommit={v => updater('holdings', 'btcHot', parseNum(v))} />
                  <InputField label="冷錢包 BTC" value={holdings.btcCold} type="number" onCommit={v => updater('holdings', 'btcCold', parseNum(v))} />
                  <InputField label="ETH 數量" value={holdings.eth} type="number" onCommit={v => updater('holdings', 'eth', parseNum(v))} />
                  <InputField label="ADA 數量" value={holdings.ada} type="number" onCommit={v => updater('holdings', 'ada', parseNum(v))} />
                  
                  <InputField label="QQQ 總值 (TWD)" value={holdings.qqq} type="number" onCommit={v => updater('holdings', 'qqq', parseNum(v))} hint="台幣等值" />
                  <InputField label="VOO 總值 (TWD)" value={holdings.voo} type="number" onCommit={v => updater('holdings', 'voo', parseNum(v))} hint="台幣等值" />
                  <InputField label="預備金 USDT" value={holdings.usdtReserve} type="number" onCommit={v => updater('holdings', 'usdtReserve', parseNum(v))} />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <InputField label="目標退休年份" value={config.targetYear} type="number" onCommit={v => updater('config', 'targetYear', parseNum(v))} />
                  <InputField label="最終目標 BTC" value={config.goalBtc} type="number" onCommit={v => updater('config', 'goalBtc', parseNum(v))} />
                </div>
              </Card>

              <Card title="系統管理" icon="⚙️">
                <div className="grid grid-cols-2 gap-3 mb-4">
                  <button onClick={() => { navigator.clipboard.writeText(JSON.stringify(appData)); setModal({title:"成功", body:"已複製備份資料。"}); }} className="bg-slate-700 py-3 rounded-lg text-xs font-bold text-white hover:bg-slate-600">匯出備份 JSON</button>
                  <button onClick={() => { try{ const d = JSON.parse(prompt("請貼上 JSON:")); if(d.state){ setAppData(d); alert("還原成功");} }catch(e){ alert("資料格式錯誤"); } }} className="bg-slate-700 py-3 rounded-lg text-xs font-bold text-white hover:bg-slate-600">匯入還原</button>
                </div>
                <button onClick={() => { updater('state', 'lastDcaMonth', null); setModal({title:"已解鎖", body:"本月已解除鎖定，可重新執行 DCA。"}); }} className="w-full bg-yellow-600/20 text-yellow-500 border border-yellow-600/50 py-3 rounded-lg text-xs font-bold hover:bg-yellow-600 hover:text-slate-900 transition-colors">
                  強制解除「本月 DCA 已執行」鎖定
                </button>
              </Card>
            </div>
          )}

          {/* 解決痛點2：保護最底部內容不被 Tabbar 遮擋的 Spacer */}
          <div className="h-28 shrink-0 w-full pointer-events-none"></div>

        </div>
      </div>

      <div className="tabbar">
        <div className="tabbar-inner gap-2">
          {[{ id: 'home', label: '行動', icon: '⚡' }, { id: 'convert', label: '狙擊', icon: '🎯' }, { id: 'sop', label: '憲法', icon: '📜' }, { id: 'system', label: '設定', icon: '⚙️' }].map(t => (
            <button key={t.id} onClick={() => setTab(t.id)} className={`flex-1 py-2 rounded-xl flex flex-col items-center justify-center gap-1 transition-colors ${tab === t.id ? 'bg-slate-800 text-emerald-400 border border-slate-700' : 'text-slate-500 hover:bg-slate-800/50'}`}>
              <span className="text-lg">{t.icon}</span><span className="text-[10px] font-bold">{t.label}</span>
            </button>
          ))}
        </div>
      </div>

      {modal && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in" onClick={(e)=> e.target===e.currentTarget && setModal(null)}>
          <div className="bg-slate-800 border border-slate-600 w-full max-w-sm rounded-2xl p-6 shadow-2xl relative">
            <h3 className="text-xl font-bold text-white mb-3">{modal.title}</h3>
            {typeof modal.body === "string" ? <div className="text-slate-300 mb-5 whitespace-pre-wrap text-sm leading-relaxed">{modal.body}</div> : <div className="text-slate-300 mb-5">{modal.body}</div>}
            <button onClick={()=>setModal(null)} className="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded-xl text-white font-bold transition-colors">關閉</button>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
