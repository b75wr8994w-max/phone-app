<script type="text/babel" data-type="module">
import React, { useState, useEffect, useMemo, useRef } from 'react';
import { createRoot } from 'react-dom/client';
import { 
  Shield, CalendarCheck, Target, TrendingUp, AlertTriangle, 
  ShieldCheck, Activity, DollarSign, Clock, Map, Flame, Zap,
  Eye, EyeOff, Save, Download, Upload, Settings, CheckCircle2,
  Home, Crosshair, BookOpen, Sliders
} from 'lucide-react';

/* ===== 核心常數與設定 ===== */
const TWD_EXCHANGE_RATE = 31.8; 
const SAVE_KEY = "p2047_v8_constitution_save";
const CACHE_KEY_METRICS = "p2047_v8_metrics_cache";
const APP_VERSION = "8.0.0";

const FIXED_MONTH_PARTS = 4;
const BLACK_SWAN_WEEKS = 4;
const BLACK_SWAN_STOP_REBOUND = 15;

const ETH_SNIPE_RATIO = 0.058;
const ADA_SNIPE_RATIO = 0.0000085;
const ETH_ALERT_RATIO = 0.045;
const ADA_ALERT_RATIO = 0.000008;

const normalizeConfig = (raw = {}) => ({
  goalBtc: Math.max(0.01, Number(raw.goalBtc ?? 3.0)),
  targetYear: Math.max(2026, Number(raw.targetYear ?? 2047)),
  monthlyDcaTwd: Math.max(1000, Number(raw.monthlyDcaTwd ?? 13000)), // 每月定投 TWD
  loanBalance: Math.max(0, Number(raw.loanBalance ?? 500000)),       // 預設信貸餘額
  loanPayment: Math.max(0, Number(raw.loanPayment ?? 15000)),        // 預設每月信貸還款
  loanRate: Math.max(0, Number(raw.loanRate ?? 2.5))                 // 信貸利率
});

const initialStateNow = () => ({
  btcHot: 0.0,
  btcCold: 0.55999,
  eth: 32.5802,
  ada: 75350.2,
  usdtReserve: 0,
  
  logs: [],
  consecutiveGreedWeeks: 0,
  monthPartsRemaining: FIXED_MONTH_PARTS,
  lastMonthKey: monthKeyNow(),
  lastWeeklyExecISO: null,
  sopStatus: { emergency: false, travel: false, dcaBtc: false },

  blackSwan: { active: false, remainingWeeks: 0, weeklyBudget: 0, startedAtISO: null, reason: null, lowPrice: 0, lastSpent: 0 }
});

/* ===== 輔助工具 ===== */
const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
const parseNum = (s, fallback = NaN) => { const n = Number(String(s).replace(/,/g,"")); return Number.isFinite(n) ? n : fallback; };
const monthKeyNow = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; };
const todayMMDD = () => new Date().toLocaleDateString("zh-TW", { month:"2-digit", day:"2-digit" });
const reboundPctFrom = (low, now) => (low>0 && now>0) ? ((now-low)/low)*100 : 0;
const fmtMoney = (val, currency = 'TWD') => new Intl.NumberFormat('en-US', { style: 'currency', currency, maximumFractionDigits: 0 }).format(val);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

const triggerConfetti = () => {
  if (typeof confetti === "function") confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
};

/* ===== 視覺化元件：財富推算引擎 ===== */
const NativeAreaChart = ({ data }) => {
  const [hoverIndex, setHoverIndex] = useState(null);
  if (!data || data.length === 0) return <div className="text-slate-500 text-center py-10">Initializing Model...</div>;

  const width = 800, height = 260;
  const padding = { top: 20, right: 45, bottom: 30, left: 55 };
  const innerWidth = width - padding.left - padding.right;
  const innerHeight = height - padding.top - padding.bottom;

  const maxY = Math.max(...data.map(d => d.total)) * 1.1; 
  const maxValText = (maxY / 10000000).toFixed(0) + ' 千萬';

  const getX = (index) => padding.left + (index / (data.length - 1)) * innerWidth;
  const getY = (val) => padding.top + innerHeight - (val / maxY) * innerHeight;

  const vooPathTop = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(i)} ${getY(d.voo)}`).join(' ');
  const vooArea = `${vooPathTop} L ${getX(data.length - 1)} ${getY(0)} L ${getX(0)} ${getY(0)} Z`;

  const qqqPathTop = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(i)} ${getY(d.voo + d.qqq)}`).join(' ');
  const qqqPathBottom = [...data].reverse().map((d, i) => `L ${getX(data.length - 1 - i)} ${getY(data[data.length - 1 - i].voo)}`).join(' ');
  const qqqArea = `${qqqPathTop} ${qqqPathBottom} Z`;

  const cryptoPathTop = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(i)} ${getY(d.total)}`).join(' ');
  const cryptoPathBottom = [...data].reverse().map((d, i) => `L ${getX(data.length - 1 - i)} ${getY(data[data.length - 1 - i].voo + data[data.length - 1 - i].qqq)}`).join(' ');
  const cryptoArea = `${cryptoPathTop} ${cryptoPathBottom} Z`;
  
  const prinPath = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(i)} ${getY(d.totalPrin)}`).join(' ');
  const realTotalPath = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(i)} ${getY(d.realTotal)}`).join(' ');

  const handleInteraction = (e) => {
    if (!e || !e.currentTarget) return;
    const rect = e.currentTarget.getBoundingClientRect();
    let clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
    if (clientX === undefined) return;
    const x = clientX - rect.left;
    const relativeX = Math.max(0, Math.min(x - (rect.width * (padding.left/width)), rect.width * (innerWidth/width)));
    const percentage = relativeX / (rect.width * (innerWidth/width));
    const index = Math.max(0, Math.min(data.length - 1, Math.round(percentage * (data.length - 1))));
    setHoverIndex(prev => (prev !== index ? index : prev));
  };

  let tooltipStyle = {};
  if (hoverIndex !== null) {
      tooltipStyle = hoverIndex > (data.length / 2) 
        ? { right: `${100 - (hoverIndex / (data.length - 1)) * 100}%`, marginRight: '15px' }
        : { left: `${(hoverIndex / (data.length - 1)) * 100}%`, marginLeft: '15px' };
  }

  return (
    <div className="relative w-full h-full flex flex-col font-mono select-none">
      <div className="relative flex-1 touch-pan-y" 
           onTouchMove={handleInteraction} onTouchStart={handleInteraction} 
           onMouseMove={handleInteraction} onMouseLeave={() => setHoverIndex(null)}>
        <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-full overflow-visible">
          <defs>
            <linearGradient id="gradVOO" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#10b981" stopOpacity="0.8"/><stop offset="100%" stopColor="#10b981" stopOpacity="0.2"/></linearGradient>
            <linearGradient id="gradQQQ" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#3b82f6" stopOpacity="0.8"/><stop offset="100%" stopColor="#3b82f6" stopOpacity="0.2"/></linearGradient>
            <linearGradient id="gradCrypto" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#f59e0b" stopOpacity="0.8"/><stop offset="100%" stopColor="#f59e0b" stopOpacity="0.2"/></linearGradient>
          </defs>
          <line x1={padding.left} y1={padding.top} x2={width - padding.right} y2={padding.top} stroke="#334155" strokeDasharray="4 4" />
          <text x={padding.left - 10} y={padding.top + 4} fill="#64748b" textAnchor="end">{maxValText}</text>
          <line x1={padding.left} y1={height - padding.bottom} x2={width - padding.right} y2={height - padding.bottom} stroke="#334155" />
          <text x={padding.left - 10} y={height - padding.bottom + 4} fill="#64748b" textAnchor="end">0</text>

          {data.map((d, i) => (i % 3 === 0 || i === data.length - 1) && (
            <text key={i} x={getX(i)} y={height - 10} fill="#94a3b8" textAnchor="middle">{d.year}</text>
          ))}

          <path d={vooArea} fill="url(#gradVOO)" className="transition-all duration-300" />
          <path d={qqqArea} fill="url(#gradQQQ)" className="transition-all duration-300" />
          <path d={cryptoArea} fill="url(#gradCrypto)" className="transition-all duration-300" />
          <path d={vooPathTop} fill="none" stroke="#059669" strokeWidth="1" opacity="0.5" />
          <path d={qqqPathTop} fill="none" stroke="#2563eb" strokeWidth="1" opacity="0.5" />
          <path d={cryptoPathTop} fill="none" stroke="#d97706" strokeWidth="1.5" />
          <path d={prinPath} fill="none" stroke="#f8fafc" strokeWidth="2.5" strokeDasharray="6 4" className="transition-all duration-300 drop-shadow-md" />
          <path d={realTotalPath} fill="none" stroke="#60a5fa" strokeWidth="1.5" strokeDasharray="2 4" opacity="0.7" className="transition-all duration-300" />

          {hoverIndex !== null && (
            <g>
              <line x1={getX(hoverIndex)} y1={padding.top} x2={getX(hoverIndex)} y2={height - padding.bottom} stroke="rgba(255,255,255,0.3)" strokeWidth="1" strokeDasharray="4 2" />
              <circle cx={getX(hoverIndex)} cy={getY(data[hoverIndex].total)} r="4" fill="#0f172a" stroke="#f59e0b" strokeWidth="2" />
              <circle cx={getX(hoverIndex)} cy={getY(data[hoverIndex].totalPrin)} r="4" fill="#f8fafc" stroke="#0f172a" strokeWidth="2" />
            </g>
          )}
        </svg>

        {hoverIndex !== null && (
          <div className="absolute pointer-events-none bg-slate-900/95 backdrop-blur-xl border border-slate-600 p-3 rounded-xl shadow-[0_10px_30px_rgba(0,0,0,0.8)] z-20 w-[240px]"
               style={{ top: '5px', ...tooltipStyle }}>
            <div className="flex justify-between items-end border-b border-slate-700 pb-2 mb-2">
              <span className="text-white font-bold text-sm">{data[hoverIndex].year} 年</span>
              <span className="text-slate-400 font-normal text-xs">年齡: {data[hoverIndex].age} 歲</span>
            </div>
            <div className="bg-slate-800/80 rounded p-2 mb-2 border border-slate-700/50">
              <p className="text-[10px] text-slate-400 mb-0.5">年度戰略 (信貸狀態: {data[hoverIndex].loanActive ? '還款中' : '已清零'})</p>
              <p className="text-[11px] text-blue-300 font-bold leading-tight">{data[hoverIndex].injectDesc}</p>
            </div>
            <div className="space-y-1.5">
              <p className="text-xs text-amber-400 flex justify-between"><span>Crypto</span><span>{fmtMoney(data[hoverIndex].crypto)}</span></p>
              <p className="text-xs text-blue-400 flex justify-between"><span>QQQ</span><span>{fmtMoney(data[hoverIndex].qqq)}</span></p>
              <p className="text-xs text-emerald-400 flex justify-between"><span>VOO</span><span>{fmtMoney(data[hoverIndex].voo)}</span></p>
              <div className="border-t border-slate-700 my-2 pt-2" />
              <p className="text-sm font-bold text-white flex justify-between"><span>帳面淨值</span><span>{fmtMoney(data[hoverIndex].total)}</span></p>
              <p className="text-[11px] text-emerald-400 flex justify-between items-center mt-0.5"><span>時間複利</span><span>+{fmtMoney(data[hoverIndex].total - data[hoverIndex].totalPrin)}</span></p>
              <div className="bg-blue-900/20 rounded p-1.5 mt-2">
                 <p className="text-[10px] text-blue-300 flex justify-between"><span>實質購買力</span><span className="font-bold">{fmtMoney(data[hoverIndex].realTotal)}</span></p>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

const WealthSimulatorEngine = ({ currentAssetTWD, config }) => {
  const [btcRate, setBtcRate] = useState(12);
  const [qqqRate, setQqqRate] = useState(10);
  const [vooRate, setVooRate] = useState(7);
  const [inflation, setInflation] = useState(2.5);

  const chartData = useMemo(() => {
    let qqq = 0, voo = 0;
    let crypto = (currentAssetTWD > 0) ? currentAssetTWD : 5000000;
    let qqqPrin = 0, vooPrin = 0, cryptoPrin = crypto;
    let currentLoan = config.loanBalance;
    const data = [];
    
    // 每年預計還款額
    const annualLoanPayment = config.loanPayment * 12;

    for (let i = 0; i <= (config.targetYear - 2026); i++) {
      const year = 2026 + i;
      let injectDesc = "無新增投入 (純複利掛機)";
      let loanActive = currentLoan > 0;
      let freedUpCash = 0;

      // 1. 資產自然增長
      if (i > 0) {
        qqq *= (1 + qqqRate/100); voo *= (1 + vooRate/100); crypto *= (1 + btcRate/100);
      }
      
      // 2. 處理信貸扣款與釋放
      if (loanActive) {
        let interest = currentLoan * (config.loanRate / 100);
        let principal = annualLoanPayment - interest;
        currentLoan -= principal;
        
        if (currentLoan <= 0) {
          freedUpCash = Math.abs(currentLoan); // 當年多出來沒還完的現金
          currentLoan = 0;
          loanActive = false;
        }
      } else {
        freedUpCash = annualLoanPayment; // 信貸清零後，整年還款額完全解放
      }

      // 3. 資金注入邏輯 (動態結合信貸與月投)
      const baseInvestTwd = config.monthlyDcaTwd * 12;

      if (year <= 2031) { 
        crypto += baseInvestTwd; 
        cryptoPrin += baseInvestTwd;
        injectDesc = `定投 BTC (${fmtMoney(baseInvestTwd/12)}/月)`;
        if (year === 2031) {
          qqq += 300000; qqqPrin += 300000; crypto += 300000; cryptoPrin += 300000;
          injectDesc = "保單奇點閃電戰 (+60w) & " + injectDesc;
        }
      } else if (year >= 2032 && year <= 2039) {
        let totalInvest = baseInvestTwd + freedUpCash;
        qqq += totalInvest; 
        qqqPrin += totalInvest;
        injectDesc = `全力定投 QQQ (${fmtMoney(totalInvest/12)}/月)`;
      } else if (year >= 2040) {
        let totalInvest = baseInvestTwd + freedUpCash;
        voo += totalInvest; 
        vooPrin += totalInvest;
        injectDesc = `防禦轉移 VOO (${fmtMoney(totalInvest/12)}/月)`;
      }
      
      const totalPrin = qqqPrin + vooPrin + cryptoPrin;
      const total = qqq + voo + crypto;
      const realTotal = total / Math.pow(1 + inflation/100, i);
      
      data.push({
        year, age: 29 + i, qqq: Math.round(qqq), voo: Math.round(voo), crypto: Math.round(crypto), 
        total: Math.round(total), qqqPrin: Math.round(qqqPrin), vooPrin: Math.round(vooPrin),
        cryptoPrin: Math.round(cryptoPrin), totalPrin: Math.round(totalPrin), realTotal: Math.round(realTotal),
        injectDesc, loanActive
      });
    }
    return data;
  }, [btcRate, qqqRate, vooRate, inflation, currentAssetTWD, config]);

  const SliderControl = ({ label, value, set, min, max, step = 1, color }) => {
    const colors = { amber: "accent-amber-500 text-amber-400", emerald: "accent-emerald-500 text-emerald-400", blue: "accent-blue-500 text-blue-400", cyan: "accent-cyan-500 text-cyan-400" };
    return (
      <div className="flex flex-col">
        <div className="flex justify-between items-center mb-1.5">
          <span className="text-[10px] text-slate-400 font-medium">{label}</span>
          <span className={`text-xs font-mono font-bold ${colors[color].split(' ')[1]}`}>{value}%</span>
        </div>
        <input type="range" min={min} max={max} step={step} value={value} onChange={(e) => set(Number(e.target.value))} className={`w-full h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer ${colors[color].split(' ')[0]} outline-none`} />
      </div>
    );
  };

  const finalYear = chartData[chartData.length - 1];

  return (
    <div className="flex flex-col h-full space-y-4">
      <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-700/80 shadow-inner">
        <div className="grid grid-cols-4 gap-3">
          <SliderControl label="BTC" value={btcRate} set={setBtcRate} min={5} max={25} color="amber" />
          <SliderControl label="QQQ" value={qqqRate} set={setQqqRate} min={5} max={15} color="blue" />
          <SliderControl label="VOO" value={vooRate} set={setVooRate} min={3} max={12} color="emerald" />
          <SliderControl label="通膨" value={inflation} set={setInflation} min={1} max={5} step={0.1} color="cyan" />
        </div>
      </div>
      <div className="flex flex-row justify-between items-end px-2 border-b border-slate-800 pb-2">
        <div>
          <p className="text-[10px] text-slate-500 font-mono mb-0.5">EST. {config.targetYear} 帳面總額</p>
          <p className="text-2xl font-bold text-white tracking-tight">{fmtMoney(finalYear.total)}</p>
        </div>
        <div className="text-right">
          <p className="text-[10px] text-blue-400/70 font-mono mb-0.5">實質購買力 (拔管底線)</p>
          <p className="text-lg font-bold text-blue-400 drop-shadow-[0_0_8px_rgba(59,130,246,0.4)] tracking-tight">
            {fmtMoney(finalYear.realTotal)}
          </p>
        </div>
      </div>
      <div className="flex-1 min-h-[220px] w-full mt-2 relative">
        <NativeAreaChart data={chartData} />
      </div>
    </div>
  );
};


/* ===== 主應用 ===== */
function App() {
  const [tab, setTab] = useState("home");
  const [state, setState] = useState(initialStateNow());
  const [config, setConfig] = useState(normalizeConfig());
  const [ui, setUi] = useState({ btcPrice: 90000, fngIndex: 50, ethBtcRatio: 0.05, adaBtcRatio: 0.000008, athDrawdownPct: 0, below200w: 0 });
  const [privacyMode, setPrivacyMode] = useState(false);
  const [modal, setModal] = useState(null);

  // 初始化與存檔
  useEffect(() => {
    try {
      const saved = localStorage.getItem(SAVE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed.config) setConfig(normalizeConfig(parsed.config));
        if (parsed.state) setState({ ...initialStateNow(), ...parsed.state });
        if (parsed.ui) setUi({ ...ui, ...parsed.ui });
      }
    } catch (e) {}
  }, []);

  useEffect(() => {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ config, state, ui }));
  }, [state, config, ui]);

  // SOP 月份自動重置
  useEffect(() => {
    const nowKey = monthKeyNow();
    if (state.lastMonthKey !== nowKey) {
      setState(p => ({
        ...p, lastMonthKey: nowKey, monthPartsRemaining: FIXED_MONTH_PARTS,
        sopStatus: { emergency: false, travel: false, dcaBtc: false }
      }));
    }
  }, [state.lastMonthKey]);

  // API 數據更新
  const fetchMarketData = async () => {
    try {
      const [priceRes, fngRes] = await Promise.all([
        fetch('https://api.binance.com/api/v3/ticker/price?symbols=["BTCUSDT","ETHUSDT","ADAUSDT"]'),
        fetch('https://api.alternative.me/fng/?limit=1')
      ]);
      const priceData = await priceRes.json();
      const fngData = await fngRes.json();
      
      const prices = {};
      priceData.forEach(item => { prices[item.symbol.replace('USDT', '')] = parseFloat(item.price); });
      
      setUi(p => ({
        ...p,
        btcPrice: prices.BTC || p.btcPrice,
        ethBtcRatio: prices.ETH && prices.BTC ? prices.ETH/prices.BTC : p.ethBtcRatio,
        adaBtcRatio: prices.ADA && prices.BTC ? prices.ADA/prices.BTC : p.adaBtcRatio,
        fngIndex: parseInt(fngData?.data?.[0]?.value || "50", 10)
      }));
    } catch (e) {
      console.warn("API Fetch failed, using cache.");
    }
  };

  useEffect(() => {
    fetchMarketData();
    const timer = setInterval(fetchMarketData, 30000);
    return () => clearInterval(timer);
  }, []);

  // 衍生數據
  const totalBtc = state.btcHot + state.btcCold;
  const portfolioUsdt = (totalBtc * ui.btcPrice) + (state.eth * ui.ethBtcRatio * ui.btcPrice) + (state.ada * ui.adaBtcRatio * ui.btcPrice) + state.usdtReserve;
  const portfolioTwd = portfolioUsdt * TWD_EXCHANGE_RATE;
  
  const monthlyUsdtDca = config.monthlyDcaTwd / TWD_EXCHANGE_RATE;
  const partUsdt = monthlyUsdtDca / FIXED_MONTH_PARTS;
  const reserveCapUsdt = monthlyUsdtDca * 6;

  const addLog = (msg, type="info") => {
    setState(p => ({ ...p, logs: [{ id: Date.now(), date: todayMMDD(), msg, type }, ...p.logs].slice(0, 100) }));
  };

  const toggleSop = (key) => {
    setState(p => {
      const newStatus = { ...p.sopStatus, [key]: !p.sopStatus[key] };
      if (newStatus.emergency && newStatus.travel && newStatus.dcaBtc && !p.sopStatus[key]) triggerConfetti();
      return { ...p, sopStatus: newStatus };
    });
  };

  // 每週執行核心邏輯 (繼承 v7.1)
  const isSameISOWeek = (isoA, isoB) => {
    if(!isoA || !isoB) return false;
    const weekKey = (d) => {
      const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dayNum = date.getUTCDay() || 7;
      date.setUTCDate(date.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
      return `${date.getUTCFullYear()}-W${Math.ceil((((date - yearStart)/86400000) + 1)/7)}`;
    };
    return weekKey(new Date(isoA)) === weekKey(new Date(isoB));
  };
  const canExecuteThisWeek = !isSameISOWeek(state.lastWeeklyExecISO, new Date().toISOString());

  const executeWeekly = () => {
    if (!canExecuteThisWeek) return setModal({ title:"本週已鎖定", body:"本週已執行過。如需重按請至系統設定解鎖。" });

    const fng = ui.fngIndex;
    let partsLeft = state.monthPartsRemaining;
    let spend = 0, save = 0, action = "";

    if (partsLeft <= 0) {
      action = "本月份額已用完，本次不新增月薪資金。";
    } else {
      if (fng < 20) { action = "A 極度恐慌：4買0存"; spend = 4; save = 0; }
      else if (fng <= 40) { action = "B 恐懼：3買1存"; spend = 3; save = 1; }
      else if (fng <= 75) { action = "C 中性/偏貪：2買2存"; spend = 2; save = 2; }
      else { action = "D 貪婪：0買4存"; spend = 0; save = 4; }

      if (spend + save > partsLeft) {
        spend = Math.min(spend, partsLeft); save = Math.min(save, partsLeft - spend);
      }
    }

    const usdtSpent = spend * partUsdt;
    const usdtSaved = save * partUsdt;
    const btcBought = usdtSpent > 0 ? (usdtSpent / ui.btcPrice) : 0;

    setState(p => ({
      ...p,
      btcHot: p.btcHot + btcBought,
      usdtReserve: p.usdtReserve + usdtSaved,
      monthPartsRemaining: partsLeft - (spend + save),
      lastWeeklyExecISO: new Date().toISOString()
    }));

    addLog(`週報：${action}`, usdtSpent > 0 ? "success" : "warning");
    if (usdtSaved > 0) addLog(`存入預備金：+${Math.round(usdtSaved)}U`, "info");
    if (usdtSpent > 0) addLog(`買入 ${btcBought.toFixed(6)} BTC`, "success");
    triggerConfetti();
  };

  // 渲染頁面
  const Card = ({ title, icon: Icon, children, className = "" }) => (
    <div className={`bg-slate-900/70 rounded-xl border border-slate-700/50 flex flex-col overflow-hidden ${className}`}>
      <div className="flex items-center px-4 py-3 border-b border-slate-800 bg-slate-800/40">
        <Icon className="text-slate-400 w-4 h-4 mr-2" />
        <h2 className="text-sm font-bold text-slate-100">{title}</h2>
      </div>
      <div className="p-4 flex-1 flex flex-col relative">{children}</div>
    </div>
  );

  const InputField = ({ label, value, onChange, type="number" }) => (
    <div className="mb-3">
      <label className="block text-[11px] text-slate-400 mb-1">{label}</label>
      <input type={type} value={value} onChange={onChange} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm font-mono text-white outline-none focus:border-emerald-500" />
    </div>
  );

  const mask = (val, formatter) => privacyMode ? "****" : formatter(val);

  return (
    <div className="app-shell">
      {/* 頂部導航 */}
      <div className="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 shrink-0 z-10 flex justify-between items-center">
        <div>
          <div className="text-[10px] text-slate-500 font-mono mb-1 tracking-widest uppercase">Project {config.targetYear}</div>
          <div className="text-xl font-bold font-mono text-white flex items-center gap-2">
            {mask(totalBtc, v=>v.toFixed(6))} <span className="text-xs text-slate-500 font-normal">/ {config.goalBtc} BTC</span>
          </div>
        </div>
        <div className="text-right flex flex-col items-end">
          <div className="text-[10px] text-slate-500 mb-1 flex items-center gap-1 cursor-pointer" onClick={()=>setPrivacyMode(!privacyMode)}>
            EST. TWD {privacyMode ? <EyeOff className="w-3 h-3"/> : <Eye className="w-3 h-3"/>}
          </div>
          <div className="text-sm font-bold text-emerald-400 font-mono drop-shadow-[0_0_8px_rgba(16,185,129,0.3)]">
            {mask(portfolioTwd, fmtMoney)}
          </div>
        </div>
      </div>

      {/* 滾動內容區 */}
      <div className="content-scroll p-4 space-y-4">
        
        {tab === "home" && (
          <div className="space-y-4 animate-fade-in">
            <div className="grid grid-cols-2 gap-3">
              <Card title="Hot Wallet" icon={Zap} className="border-t-2 border-t-amber-500">
                <div className="text-lg font-mono font-bold text-amber-400 mb-2">{mask(state.btcHot, v=>v.toFixed(6))}</div>
                <button onClick={() => {
                  if(state.btcHot < 0.05) return alert("未達 0.05 提領門檻");
                  setState(p => ({...p, btcCold: p.btcCold + p.btcHot, btcHot: 0}));
                  triggerConfetti(); addLog("BTC 提領至冷錢包成功", "secure");
                }} className="text-[10px] py-1.5 rounded border border-slate-700 bg-slate-800 hover:bg-slate-700 w-full font-bold">➔ 轉冷錢包</button>
              </Card>
              <Card title="Cold Wallet" icon={ShieldCheck} className="border-t-2 border-t-sky-500">
                <div className="text-lg font-mono font-bold text-sky-400 drop-shadow-[0_0_8px_rgba(56,189,248,0.3)]">{mask(state.btcCold, v=>v.toFixed(6))}</div>
                <div className="text-[10px] text-slate-500 mt-auto">絕對防禦領域</div>
              </Card>
            </div>

            <Card title="每週執行樞紐" icon={Activity}>
              <div className="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                <div className="flex flex-col">
                  <span className="text-[10px] text-slate-500 mb-1">LIVE BTC/USDT</span>
                  <span className="font-mono text-lg text-white">${ui.btcPrice.toLocaleString()}</span>
                </div>
                <div className="flex flex-col items-end">
                  <span className="text-[10px] text-slate-500 mb-1">恐貪指數</span>
                  <span className={`font-mono text-lg font-bold ${ui.fngIndex > 75 ? 'text-emerald-400' : ui.fngIndex < 25 ? 'text-red-400' : 'text-yellow-400'}`}>{ui.fngIndex}</span>
                </div>
              </div>
              <div className="flex justify-between items-center mb-3">
                <span className="text-[10px] text-slate-400">本月份額 (1份={Math.round(partUsdt)}U)</span>
                <div className="flex gap-1">
                  {[...Array(FIXED_MONTH_PARTS)].map((_, i) => (
                    <div key={i} className={`h-2.5 w-6 rounded-sm border ${i < state.monthPartsRemaining ? 'bg-emerald-500 border-emerald-400 shadow-[0_0_8px_rgba(16,185,129,0.5)]' : 'bg-slate-800 border-slate-700'}`} />
                  ))}
                </div>
              </div>
              <button onClick={executeWeekly} className={`w-full py-3 rounded-xl font-bold transition-all shadow-lg text-sm ${canExecuteThisWeek ? 'bg-emerald-600 text-white hover:bg-emerald-500' : 'bg-slate-800 text-slate-500'}`}>
                {canExecuteThisWeek ? "執行本週 DCA 策略" : "本週已鎖定"}
              </button>
            </Card>

            <Card title={`SOP 盲操 (${state.lastMonthKey.split('-')[1]}月)`} icon={CalendarCheck}>
              <div className="space-y-2.5">
                {[
                  { id: 'emergency', label: '緊急預備金滿血', desc: 'NT$ 200,000' },
                  { id: 'travel', label: '娛樂旅遊金滿血', desc: 'NT$ 50,000 (嚴禁罪惡感)' },
                  { id: 'dcaBtc', label: `盲買 NT$ ${config.monthlyDcaTwd.toLocaleString()} BTC`, desc: '完成後關閉APP' }
                ].map(item => (
                  <div key={item.id} onClick={() => toggleSop(item.id)} className={`flex items-center space-x-3 p-3 rounded-lg border transition-all cursor-pointer ${state.sopStatus[item.id] ? 'bg-emerald-900/20 border-emerald-500/30' : 'bg-slate-900 border-slate-700'}`}>
                    {state.sopStatus[item.id] ? <CheckCircle2 className="w-5 h-5 text-emerald-500 shrink-0" /> : <div className="w-5 h-5 rounded-full border-2 border-slate-600 shrink-0" />}
                    <div>
                      <span className={`text-sm block ${state.sopStatus[item.id] ? 'text-slate-500 line-through' : 'text-slate-200 font-bold'}`}>{item.label}</span>
                      <span className="text-[10px] text-slate-500">{item.desc}</span>
                    </div>
                  </div>
                ))}
              </div>
            </Card>

            <Card title="動態退休推算模型" icon={TrendingUp}>
              <WealthSimulatorEngine currentAssetTWD={portfolioTwd} config={config} />
            </Card>
          </div>
        )}

        {tab === "convert" && (
          <div className="space-y-4 animate-fade-in">
            {['ETH', 'ADA'].map(coin => {
              const ratio = coin === 'ETH' ? ui.ethBtcRatio : ui.adaBtcRatio;
              const target = coin === 'ETH' ? ETH_SNIPE_RATIO : ADA_SNIPE_RATIO;
              const holding = coin === 'ETH' ? state.eth : state.ada;
              const progress = Math.min((ratio / target) * 100, 100);
              const color = coin === 'ETH' ? 'fuchsia' : 'blue';
              
              return (
                <Card key={coin} title={`${coin} 狙擊手`} icon={Crosshair} className={`border-l-2 border-${color}-500`}>
                  <div className="flex justify-between items-end mb-2">
                    <span className="text-xs text-slate-400">目前匯率: <span className="text-white font-mono">{ratio.toFixed(6)}</span></span>
                    <span className="text-xs text-slate-400">目標: <span className={`text-${color}-300 font-mono`}>{target.toFixed(6)}</span></span>
                  </div>
                  <div className="w-full bg-slate-800 rounded-full h-2.5 mb-4 border border-slate-700">
                    <div className={`h-full rounded-full transition-all bg-${color}-500`} style={{width: `${progress}%`}} />
                  </div>
                  <button onClick={() => {
                    if (ratio < target) return alert("匯率未達標");
                    const input = prompt(`請輸入實際轉換獲得的 BTC 數量 (你目前有 ${holding} ${coin}):`);
                    const btc = parseFloat(input);
                    if (btc > 0) {
                      setState(p => ({ ...p, btcHot: p.btcHot + btc, [coin.toLowerCase()]: 0 }));
                      addLog(`${coin} 狙擊成功：轉換得 ${btc} BTC`, "success"); triggerConfetti();
                    }
                  }} className={`w-full py-3 rounded-lg font-bold text-sm transition-colors ${progress >= 100 ? `bg-${color}-600 text-white animate-pulse` : 'bg-slate-800 text-slate-500'}`}>
                    {progress >= 100 ? '🔥 執行轉換並入帳' : '等待目標匯率'}
                  </button>
                </Card>
              );
            })}
          </div>
        )}

        {tab === "system" && (
          <div className="space-y-4 animate-fade-in">
            <Card title="長期與信貸參數設定" icon={Sliders}>
              <div className="grid grid-cols-2 gap-3 mb-4">
                <InputField label="目標年份" value={config.targetYear} onChange={e => setConfig({...config, targetYear: parseInt(e.target.value)||2047})} />
                <InputField label="目標 BTC" value={config.goalBtc} onChange={e => setConfig({...config, goalBtc: parseFloat(e.target.value)||3})} />
                <InputField label="每月投入 (TWD)" value={config.monthlyDcaTwd} onChange={e => setConfig({...config, monthlyDcaTwd: parseInt(e.target.value)||13000})} />
                <InputField label="信貸餘額 (TWD)" value={config.loanBalance} onChange={e => setConfig({...config, loanBalance: parseInt(e.target.value)||0})} />
                <InputField label="每月還款 (TWD)" value={config.loanPayment} onChange={e => setConfig({...config, loanPayment: parseInt(e.target.value)||0})} />
                <InputField label="信貸利率 (%)" value={config.loanRate} type="number" onChange={e => setConfig({...config, loanRate: parseFloat(e.target.value)||2.5})} />
              </div>
              <div className="text-[10px] text-slate-500 leading-relaxed mb-4">
                💡 修改信貸參數後，系統將自動精算信貸清零年份，並將解放之每月還款額自動匯入「財富推算模型」中進行後續複利計算。
              </div>
              <button onClick={() => alert("參數已自動儲存並套用至推算模型！")} className="w-full bg-emerald-700 py-3 rounded-lg font-bold text-sm text-white">套用並重新計算軌跡</button>
            </Card>

            <Card title="系統管理" icon={Settings}>
              <div className="grid grid-cols-2 gap-3">
                <button onClick={() => { navigator.clipboard.writeText(JSON.stringify({config, state, ui})); alert("已複製到剪貼簿"); }} className="bg-slate-800 py-3 rounded-lg text-xs font-bold border border-slate-700 hover:bg-slate-700">匯出備份</button>
                <button onClick={() => { 
                  try { const d = JSON.parse(prompt("貼上備份資料:")); if(d.state) { setConfig(d.config); setState(d.state); setUi(d.ui); alert("還原成功"); } } catch(e){ alert("失敗"); }
                }} className="bg-slate-800 py-3 rounded-lg text-xs font-bold border border-slate-700 hover:bg-slate-700">匯入還原</button>
              </div>
              <button onClick={() => { setState(p => ({...p, lastWeeklyExecISO: null})); alert("已解除本週鎖"); }} className="w-full mt-3 bg-yellow-600/20 text-yellow-500 border border-yellow-600/50 py-3 rounded-lg text-xs font-bold hover:bg-yellow-600 hover:text-slate-900 transition-colors">
                強制解除「本週已執行」鎖定
              </button>
            </Card>
          </div>
        )}
      </div>

      {/* 底部導航列 */}
      <div className="tabbar">
        <div className="tabbar-inner gap-2">
          {[
            { id: 'home', label: '行動', icon: Home },
            { id: 'convert', label: '狙擊', icon: Crosshair },
            { id: 'system', label: '設定', icon: Sliders }
          ].map(t => (
            <button key={t.id} onClick={() => setTab(t.id)} className={`flex-1 py-2 rounded-xl flex flex-col items-center justify-center gap-1 transition-colors ${tab === t.id ? 'bg-slate-800 text-emerald-400 border border-slate-700' : 'text-slate-500 hover:bg-slate-800/50'}`}>
              <t.icon className="w-5 h-5" />
              <span className="text-[10px] font-bold">{t.label}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

const root = createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
